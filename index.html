<!doctype html>
<html lang="pt-BR" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kohe">
<meta name="application-name" content="Kohe">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" id="themeColor" content="#090A08">
<meta name="description" content="Kohe: corridas de rua em ordem de largada. Veja detalhes, filtre por distância e inscreva-se.">
<title>Kohe</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23C4FF2E'/%3E%3Cpath d='M19 50L26 14H34L30.6 31.5L45 14H55L37.5 33L47 50H37.5L31.3 37.5L28.8 40L27 50Z' fill='%230D0F0B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Martian+Mono:wght@400;600;700&display=swap">
<style>
/* ---------- tokens ---------- */
:root{
  --ground:#F3F4EE; --surface:#FFFFFF; --raised:#E9EBE2; --sunken:#E2E5D9;
  --ink:#0D0F0B; --ink-2:#565C51; --ink-3:#8A9083;
  --line:#DCDFD2; --line-2:#C7CBBD;
  --volt:#C4FF2E; --volt-deep:#86BD00; --on-volt:#0D0F0B; --volt-text:#3B6A00; --heart:#2F7A00;
  --danger:#C9302A; --danger-bg:#FBE8E6; --danger-deep:#8A1C17;
  --warn:#8F5400; --warn-bg:#FFF0D2;
  --ok:#2E7412; --ok-bg:#E5F6CD;
  --glass:rgba(255,255,255,.76); --glass-line:rgba(13,15,11,.09);
  --shade:0 1px 2px rgba(13,15,11,.06),0 10px 28px rgba(13,15,11,.10);
  --bib:#0D0F0B; --bib-ink:#F3F4EE; --bib-pin:#F3F4EE;
  --scrim:rgba(8,9,7,.46);
  --display:"Archivo","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --sans:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Martian Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r-sm:10px; --r:14px; --r-lg:20px;
  --nav-h:66px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-mode="light"]){
    --ground:#090A08; --surface:#131511; --raised:#1C1F19; --sunken:#0F110D;
    --ink:#F1F4E9; --ink-2:#A3AA99; --ink-3:#6C7364;
    --line:#252921; --line-2:#363C30;
    --volt:#C8FF3A; --volt-deep:#78A800; --on-volt:#0D0F0B; --volt-text:#C8FF3A; --heart:#C8FF3A;
    --danger:#FF5E52; --danger-bg:#381613; --danger-deep:#9E231B;
    --warn:#F2B347; --warn-bg:#33260D;
    --ok:#C8FF3A; --ok-bg:#22300F;
    --glass:rgba(24,26,21,.74); --glass-line:rgba(241,244,233,.09);
    --shade:0 1px 2px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.5);
    --bib:#1C1F19; --bib-ink:#F1F4E9; --bib-pin:#090A08;
    --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-mode="light"]),
:root[data-mode="dark"]{
  --ground:#090A08; --surface:#131511; --raised:#1C1F19; --sunken:#0F110D;
  --ink:#F1F4E9; --ink-2:#A3AA99; --ink-3:#6C7364;
  --line:#252921; --line-2:#363C30;
  --volt:#C8FF3A; --volt-deep:#78A800; --on-volt:#0D0F0B; --volt-text:#C8FF3A; --heart:#C8FF3A;
  --danger:#FF5E52; --danger-bg:#381613; --danger-deep:#9E231B;
  --warn:#F2B347; --warn-bg:#33260D;
  --ok:#C8FF3A; --ok-bg:#22300F;
  --glass:rgba(24,26,21,.74); --glass-line:rgba(241,244,233,.09);
  --shade:0 1px 2px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.5);
  --bib:#1C1F19; --bib-ink:#F1F4E9; --bib-pin:#090A08;
  --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{height:100%;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--ground)}
body{margin:0;height:100%;height:100dvh;overflow:hidden;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--ground)}
#view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;outline:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
input,select,textarea{font:inherit;font-size:16px;color:inherit}
a{color:var(--volt-text);text-underline-offset:3px}
a:hover{color:var(--ink)}
:focus-visible{outline:2.5px solid var(--volt-deep);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0;text-wrap:pretty}
ul{margin:0;padding:0}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- type ---------- */
.disp{font-family:var(--display);font-stretch:68%;font-style:italic;font-weight:850;text-transform:uppercase;letter-spacing:-.005em;line-height:.92}
.eyebrow{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{--bg:var(--surface);--fg:var(--ink);--depth:var(--line-2);--edge:var(--line-2);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 22px;border-radius:var(--r);
  background:var(--bg);color:var(--fg);border:1.5px solid var(--edge);box-shadow:0 4px 0 var(--depth);
  font-family:var(--display);font-stretch:82%;font-style:italic;font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.02em;
  transition:transform .08s ease,box-shadow .08s ease;text-decoration:none;margin-bottom:4px}
.btn:hover{color:var(--fg)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--depth)}
.btn[disabled],.btn.is-off{opacity:.45;pointer-events:none;box-shadow:0 4px 0 var(--depth)}
.btn-volt{--bg:var(--volt);--fg:var(--on-volt);--depth:var(--volt-deep);--edge:var(--volt-deep)}
.btn-ink{--bg:var(--ink);--fg:var(--ground);--depth:var(--ink-3);--edge:var(--ink)}
.btn-danger{--bg:var(--danger);--fg:#fff;--depth:var(--danger-deep);--edge:var(--danger)}
.btn-outline-danger{--fg:var(--danger);--edge:var(--danger);--depth:var(--danger)}
.btn-ghost{--edge:transparent;--depth:transparent;background:transparent;box-shadow:none;margin-bottom:0}
.btn-block{width:100%}
.btn-sm{min-height:44px;font-size:15px;padding:0 16px;border-radius:12px}
.btn .i{width:20px;height:20px;stroke-width:2.4}
.btn-row{display:flex;gap:10px}
.btn-row>.btn{flex:1}
.icon-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line);color:var(--ink);flex:none;position:relative}
.icon-btn .dot{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--volt);color:var(--on-volt);border:2px solid var(--ground);font-family:var(--mono);font-size:10px;font-weight:700;display:grid;place-items:center}
.linkbtn{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center}

/* ---------- fields ---------- */
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:7px;position:relative;scroll-margin-top:120px}
.field>label,.label{font-size:13.5px;font-weight:700;color:var(--ink)}
.field .opt{font-weight:500;color:var(--ink-3)}
.input{height:54px;width:100%;padding:0 16px;border-radius:var(--r);border:1.5px solid var(--line-2);background:var(--surface);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
input[type="date"].input,input[type="time"].input{min-width:0;display:block}
textarea.input{height:auto;min-height:112px;padding:14px 16px;resize:vertical;line-height:1.45}
.input::placeholder{color:var(--ink-3)}
.input:focus{border-color:var(--ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--volt) 55%,transparent)}
.input[readonly]{background:var(--raised);color:var(--ink-2);border-color:var(--line)}
.field.bad .input,.field.bad .pick,.field.bad .choice,.field.bad .drop{border-color:var(--danger)!important;box-shadow:0 0 0 4px color-mix(in srgb,var(--danger) 16%,transparent)}
.field.bad>label{color:var(--danger)}
.field .msg{display:none;align-items:flex-start;gap:6px;font-size:12.5px;font-weight:600;color:var(--danger)}
.field .msg .i{width:16px;height:16px;margin-top:1px}
.field.bad .msg{display:flex}
.field .hint{font-size:12.5px;color:var(--ink-2)}
.input-wrap{position:relative}
.input-wrap .input{padding-right:54px}
.input-wrap .suffix{position:absolute;right:5px;top:5px;width:44px;height:44px;display:grid;place-items:center;color:var(--ink-2);border-radius:10px}
.input-wrap.prefix .input{padding-left:46px;padding-right:16px}
.input-wrap .pre{position:absolute;left:16px;top:0;height:54px;display:flex;align-items:center;font-weight:700;color:var(--ink-2);pointer-events:none}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row-num{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:12px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;font-weight:600;cursor:pointer}
.check input{width:22px;height:22px;margin:0;accent-color:var(--ink)}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:12.5px;color:var(--ink-2)}
.rules li{display:flex;gap:7px;align-items:center;list-style:none}
.rules li::before{content:"";width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;flex:none}
.rules li.ok{color:var(--ok);font-weight:650}
.rules li.ok::before{background:currentColor}

/* ---------- auth ---------- */
.auth{min-height:100%;display:flex;flex-direction:column;gap:24px;max-width:480px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom))}
.brand{display:flex;flex-direction:column;gap:14px;padding-top:34px}
.wordmark{position:relative;display:inline-block;align-self:flex-start;font-size:104px;line-height:.8;padding-right:6px}
.wordmark::after{content:"";position:absolute;left:-6px;right:-10px;bottom:-12px;height:14px;background:var(--volt);transform:skewX(-18deg);z-index:-1}
.brand-wrap{position:relative;z-index:0}
.tagline{font-size:17px;line-height:1.35;color:var(--ink-2);max-width:30ch;margin-top:10px}
.tagline b{color:var(--ink)}
.testacc{border:1.5px dashed var(--line-2);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:4px}
.testacc-head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:6px}
.acc{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;min-height:52px;padding:6px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.acc:first-of-type{border-top:0}
.acc .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.acc .who b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .who span{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.acc .use{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;border-radius:9px;background:var(--raised)}
.steps-top{display:flex;align-items:center;gap:12px}
.progress{flex:1;height:14px;border-radius:99px;background:var(--raised);overflow:hidden}
.progress i{display:block;height:100%;border-radius:99px;background:var(--volt);box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--volt-deep) 55%,transparent);transition:width .35s cubic-bezier(.2,.8,.2,1)}
.step-title{display:flex;flex-direction:column;gap:6px}
.step-title h1{font-size:46px}
.grow{flex:1}
/* ---------- screens shell ---------- */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.topbar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 18px 10px}
.topbar-in .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.topbar-in h1{font-size:32px}
.page{max-width:560px;margin:0 auto;padding:6px 18px calc(var(--nav-h) + 44px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.page.has-fab{padding-bottom:calc(var(--nav-h) + 110px + env(safe-area-inset-bottom))}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-top:6px}
.section-title h2{font-size:26px}

/* ---------- feed ---------- */
.logo-sm{font-size:30px;position:relative;display:inline-block;align-self:flex-start;padding-right:4px;z-index:0}
.logo-sm::after{content:"";position:absolute;left:-3px;right:-5px;bottom:-4px;height:6px;background:var(--volt);transform:skewX(-18deg);z-index:-1}
.feedsum{display:flex;justify-content:space-between;align-items:center;gap:10px}
.active-filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.active-filters::-webkit-scrollbar{display:none}
.fchip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 8px 0 12px;border-radius:99px;background:var(--ink);color:var(--ground);font-size:12.5px;font-weight:650}
.fchip .i{width:16px;height:16px}
.day{display:flex;align-items:flex-end;gap:10px;padding:16px 2px 2px}
.day .dnum{font-size:50px;line-height:.78}
.day .dtxt{display:flex;flex-direction:column;gap:3px;padding-bottom:2px}
.day .dname{font-family:var(--display);font-stretch:75%;font-style:italic;font-weight:800;font-size:17px;text-transform:uppercase;line-height:1}
.day .rel{margin-left:auto;padding-bottom:3px}
.rel.soon{color:var(--volt-text)}
.rc{display:grid;grid-template-columns:80px minmax(0,1fr);gap:14px;padding:12px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);position:relative;color:var(--ink);transition:transform .12s ease}
.rc:has(.rc-link:active){transform:scale(.985)}
.rc-link{color:inherit;text-decoration:none}
.rc-link:hover{color:inherit}
.rc-link::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:1}
.rc-link:focus-visible{outline:none}
.rc:has(.rc-link:focus-visible){outline:2.5px solid var(--volt-deep);outline-offset:2px}
.rc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fav{position:relative;z-index:2;display:inline-flex;align-items:center;gap:5px;min-height:44px;min-width:44px;padding:0 8px;margin:-10px -8px -10px 0;border-radius:99px;color:var(--ink-2);font-family:var(--mono);font-size:12px;font-weight:700;flex:none}
.fav .i{width:20px;height:20px}
.fav.on{color:var(--heart)}
.fav.on .i{fill:currentColor}
.fav.pop .i{animation:beat .4s cubic-bezier(.2,1.6,.4,1)}
.fav.big{margin:0;padding:0 14px;border:1.5px solid var(--line-2);background:var(--surface)}
.fav.big.on{border-color:currentColor}
.fav-row{display:flex;align-items:center;gap:12px;font-size:14px}
.fav .fl{font-family:var(--sans);font-size:14px;font-weight:700}
@keyframes beat{45%{transform:scale(1.35)}}
.rc .thumb{width:80px;height:100px;border-radius:12px;overflow:hidden;position:relative}
.rc .body{display:flex;flex-direction:column;gap:6px;min-width:0;padding:2px 0}
.rc .meta{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--ink-2);text-transform:uppercase;display:flex;gap:4px 10px;flex-wrap:wrap}
.rc .meta span{display:inline-flex;align-items:center;gap:4px}
.rc .meta .i{width:13px;height:13px;stroke-width:2.2}
.rc h3{font-family:var(--display);font-stretch:76%;font-weight:800;font-size:19px;line-height:1.06;letter-spacing:-.005em}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:4px 7px;border-radius:7px;background:var(--raised);color:var(--ink);white-space:nowrap}
.price{font-size:13px;color:var(--ink-2)}
.price b{color:var(--ink);font-weight:750}
.price.tbd{font-style:italic}
.pager{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 0 0;flex-wrap:wrap}
.pager button{min-width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface);font-family:var(--mono);font-weight:700;font-size:13px;display:grid;place-items:center}
.pager button.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.pager button[disabled]{opacity:.35}
.empty{padding:34px 16px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:12px;border:1.5px dashed var(--line-2);border-radius:var(--r-lg)}
.empty h3{font-family:var(--display);font-stretch:75%;font-style:italic;font-weight:850;font-size:24px;text-transform:uppercase;color:var(--ink)}
.empty p{max-width:32ch}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--warn-bg);color:var(--warn);font-size:13px;font-weight:600}
.note .i{width:18px;height:18px;margin-top:1px}

/* ---------- race bib art ---------- */
.bib{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 9px 12px;background:#0D0F0B;color:#F3F4EE}
.bib.t-white{background:#FFFFFF;color:#0D0F0B;box-shadow:inset 0 0 0 1px rgba(13,15,11,.14)}
.bib.t-dark{background:#0D0F0B;color:#F3F4EE;box-shadow:inset 0 0 0 1px rgba(243,244,238,.12)}
.bib.t-green{background:#C4FF2E;color:#0D0F0B}
.bib::before{content:"";position:absolute;left:-40%;right:-40%;top:var(--y,22%);height:16%;background:currentColor;opacity:.07;transform:rotate(var(--rot,-12deg))}
.bib .pin{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--surface);box-shadow:inset 0 1px 1.5px rgba(0,0,0,.4);z-index:2}
.bib .pin:nth-of-type(1){top:6px;left:6px}.bib .pin:nth-of-type(2){top:6px;right:6px}
.bib .pin:nth-of-type(3){bottom:6px;left:6px}.bib .pin:nth-of-type(4){bottom:6px;right:6px}
.bib .row{position:relative;display:flex;align-items:flex-end;gap:4px}
.bib .n{font-family:var(--display);font-stretch:62%;font-style:italic;font-weight:900;font-size:var(--ns,46px);line-height:.78;letter-spacing:-.02em}
.bib .side{display:flex;flex-direction:column;gap:3px;padding-bottom:1px;min-width:0}
.bib .u{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.bib .upto{font-family:var(--mono);font-size:8.5px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;line-height:1.2;opacity:.82;white-space:nowrap}
.bib .nm{position:relative;font-family:var(--display);font-stretch:72%;font-style:italic;font-weight:850;text-transform:uppercase;font-size:28px;line-height:.95;max-width:22ch;margin-top:14px;text-wrap:balance}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.kmtag{position:absolute;z-index:2;left:6px;bottom:6px;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:4px 6px;border-radius:6px;white-space:nowrap}
.kmtag.t-white{background:#FFFFFF;color:#0D0F0B}.kmtag.t-dark{background:#0D0F0B;color:#F3F4EE}.kmtag.t-green{background:#C4FF2E;color:#0D0F0B}
.bib.big{padding:24px 22px 26px}
.bib.big .pin{width:11px;height:11px}
.bib.big .pin:nth-of-type(1){top:14px;left:14px}.bib.big .pin:nth-of-type(2){top:14px;right:14px}
.bib.big .pin:nth-of-type(3){bottom:14px;left:14px}.bib.big .pin:nth-of-type(4){bottom:14px;right:14px}
.cover.top .bib.big .pin:nth-of-type(1),.cover.top .bib.big .pin:nth-of-type(2){top:calc(14px + env(safe-area-inset-top))}
.bib.big .row{gap:12px}
.bib.big .side{gap:6px;padding-bottom:4px}
.bib.big .u{font-size:16px}
.bib.big .upto{font-size:14px;opacity:.9}
.bib.big .upto br{display:none}
.cover .kmtag{left:14px;bottom:14px;font-size:12px;padding:6px 9px}

/* ---------- swipe to delete ---------- */
.swipe{position:relative;border-radius:var(--r-lg);overflow:hidden}
.swipe .under{position:absolute;inset:0;display:flex;justify-content:flex-end;background:var(--danger);opacity:0;transition:opacity .15s}
.swipe.dragging .under,.swipe.open .under{opacity:1}
.swipe .under button{width:92px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.swipe .rc{touch-action:pan-y;transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.swipe .rc.drag{transition:none}
.swipe-hint{display:flex;align-items:center;gap:8px}

/* ---------- tab bar + fab ---------- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;width:min(372px,calc(100% - 28px));height:var(--nav-h);border-radius:24px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--glass-line);box-shadow:var(--shade);display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding:6px;gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:18px;font-size:11px;font-weight:700;color:var(--ink-2);position:relative;text-decoration:none;transition:background .15s,color .15s}
.tab .i{width:23px;height:23px}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--volt);color:var(--on-volt)}
.tab .badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-family:var(--mono);font-size:9.5px;font-weight:700;display:grid;place-items:center}
.fab{position:fixed;z-index:41;right:max(18px,calc(50% - 262px));bottom:calc(var(--nav-h) + 30px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;background:var(--volt);color:var(--on-volt);border:1.5px solid var(--volt-deep);box-shadow:0 5px 0 var(--volt-deep),0 14px 30px rgba(0,0,0,.2);display:grid;place-items:center;transition:transform .08s,box-shadow .08s}
.fab .i{width:32px;height:32px;stroke-width:2.8}
.fab:active{transform:translateY(4px);box-shadow:0 1px 0 var(--volt-deep),0 6px 14px rgba(0,0,0,.18)}

/* ---------- sheets, dialogs, toast ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.scrim.center{align-items:center;padding:20px}
.sheet{width:100%;max-width:560px;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.scrim.center .sheet{border-radius:24px;max-width:420px;padding:22px 20px 18px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto -4px;flex:none}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sheet-head h2{font-size:34px}
.sheet .lead{color:var(--ink-2);font-size:14.5px}
@keyframes up{from{transform:translateY(48px);opacity:.3}}
@keyframes fade{from{opacity:0}}
@keyframes drop{from{transform:translate(-50%,-14px);opacity:0}}
#toastHost{position:fixed;left:0;right:0;top:0;z-index:95;pointer-events:none}
.toast{position:absolute;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--ground);padding:12px 16px;border-radius:14px;font-weight:650;font-size:14px;box-shadow:var(--shade);animation:drop .24s ease;width:max-content;max-width:calc(100% - 32px)}
.toast .i{width:18px;height:18px;color:var(--volt)}
.toast.bad .i{color:var(--danger)}

/* ---------- pickers ---------- */
.pick{display:flex;flex-wrap:wrap;gap:8px;border-radius:var(--r);border:1.5px solid transparent;transition:box-shadow .15s}
.pick button{min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface);font-family:var(--mono);font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.pick button.on{background:var(--volt);color:var(--on-volt);border-color:var(--volt-deep)}
.pick button .i{width:15px;height:15px}
.choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;border-radius:var(--r);border:1.5px solid transparent}
.choice button{min-height:54px;border-radius:var(--r);border:1.5px solid var(--line-2);background:var(--surface);font-weight:750;display:flex;align-items:center;justify-content:center;gap:8px}
.choice button.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.ac{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shade);max-height:232px;overflow-y:auto}
.ac button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;min-height:46px;padding:0 14px;text-align:left;border-top:1px solid var(--line);font-weight:600}
.ac button:first-child{border-top:0}
.ac button span{font-family:var(--mono);font-size:10.5px;color:var(--ink-2)}
.range-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px}
.range-row button{flex:none}
.drop{position:relative;display:flex;align-items:center;gap:14px;padding:12px;border-radius:var(--r);border:1.5px dashed var(--line-2);background:var(--surface);min-height:84px;cursor:pointer}
.drop .thumb{width:60px;height:74px;border-radius:10px;overflow:hidden;position:relative;flex:none;background:var(--raised);display:grid;place-items:center;color:var(--ink-2)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .txt{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--ink-2)}
.drop .txt b{color:var(--ink);font-size:14px}

/* ---------- detail / review ---------- */
.cover{position:relative;height:340px;border-radius:0 0 30px 30px;overflow:hidden;flex:none}
.cover-bar{position:absolute;z-index:5;top:calc(12px + env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.glassbtn{width:46px;height:46px;border-radius:50%;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--glass-line);color:var(--ink);display:grid;place-items:center}
.detail{max-width:560px;margin:0 auto;padding:20px 18px calc(var(--nav-h) + 44px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
.detail h1{font-size:44px;line-height:.9}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin:0}
.dl>div{background:var(--surface);padding:13px 14px;display:flex;flex-direction:column;gap:5px;min-width:0}
.dl>div.wide{grid-column:1/-1}
.dl dt{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.dl dt .i{width:14px;height:14px}
.dl dd{margin:0;font-weight:700;font-size:15px;overflow-wrap:anywhere}
.dl dd.tbd{font-weight:500;font-style:italic;color:var(--ink-2)}
.big-price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big-price small{font-size:14px;color:var(--ink-2);font-weight:600}
.big-price strong{font-family:var(--display);font-stretch:70%;font-style:italic;font-weight:900;font-size:42px;line-height:.9}
.prose{font-size:15.5px;line-height:1.55;max-width:62ch;white-space:pre-line}
.coupon{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 10px 10px 14px;border:1.5px dashed var(--line-2);border-radius:var(--r)}
.coupon code{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.05em;overflow-wrap:anywhere}
.cta-card{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--r-lg);background:var(--sunken)}
.byline{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-2)}
.mini-av{width:34px;height:34px;border-radius:11px;background:var(--ink);color:var(--volt);display:grid;place-items:center;font-family:var(--display);font-stretch:70%;font-style:italic;font-weight:900;font-size:16px;flex:none}
.review-banner{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r-lg);background:var(--volt);color:var(--on-volt)}
.review-banner .i{width:22px;height:22px;flex:none}
.review-banner p{font-size:14px;font-weight:600}
.actionbar{display:flex;flex-direction:column;gap:10px}

/* ---------- requests ---------- */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;min-height:42px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line-2);background:var(--surface);font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.seg button.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.seg .ct{font-family:var(--mono);font-size:10.5px;opacity:.72}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:4px;border-radius:16px;background:var(--raised);gap:4px}
.modes button{min-height:44px;border-radius:12px;font-weight:750;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink-2)}
.modes button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.modes .badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--danger);color:#fff;font-family:var(--mono);font-size:10px;font-weight:700;display:grid;place-items:center}
.st{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-pend{background:var(--warn-bg);color:var(--warn)}
.st-pub{background:var(--ok-bg);color:var(--ok)}
.st-neg,.st-rem{background:var(--danger-bg);color:var(--danger)}
.st-fin{background:var(--raised);color:var(--ink-2)}
.req{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:10px}
.req-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.req h3{font-family:var(--display);font-stretch:76%;font-weight:800;font-size:19px;line-height:1.08}
.req .meta{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.reason{padding:10px 12px;border-radius:12px;background:var(--danger-bg);color:var(--ink);font-size:13.5px;display:flex;flex-direction:column;gap:3px}
.reason b{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--danger)}
.person{display:flex;align-items:center;gap:12px}
.person .who{display:flex;flex-direction:column;min-width:0}
.person .who b{font-size:15px}
.person .who span{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arrow-roles{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.counter{font-family:var(--mono);font-size:11px;color:var(--ink-2);text-align:right}
.counter.ok{color:var(--ok)}

/* ---------- profile ---------- */
.me{display:flex;align-items:center;gap:14px;padding:6px 0}
.avatar{width:72px;height:72px;border-radius:22px;background:var(--ink);color:var(--volt);display:grid;place-items:center;font-family:var(--display);font-stretch:66%;font-style:italic;font-weight:900;font-size:36px;flex:none}
.me .who{display:flex;flex-direction:column;gap:6px;min-width:0}
.me .who h1{font-size:34px;overflow-wrap:anywhere}
.role{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:5px 9px;border-radius:7px;background:var(--volt);color:var(--on-volt)}
.role.usuario{background:var(--raised);color:var(--ink)}
.role .i{width:13px;height:13px;stroke-width:2.4}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:14px}
.group>h2{font-size:24px}
.group-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.setting{display:flex;align-items:center;gap:12px;min-height:52px}
.setting .txt{flex:1;display:flex;flex-direction:column;gap:2px}
.setting .txt b{font-size:15px}
.setting .txt span{font-size:12.5px;color:var(--ink-2)}
.switch{position:relative;width:58px;height:34px;flex:none}
.switch input{-webkit-appearance:none;appearance:none;width:100%;height:100%;margin:0;border-radius:99px;background:var(--line-2);transition:background .2s;cursor:pointer}
.switch input:checked{background:var(--volt)}
.switch i{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .22s cubic-bezier(.2,.8,.2,1);pointer-events:none;display:grid;place-items:center}
.switch input:checked+i{transform:translateX(24px);background:#0D0F0B}
.upgrade{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:18px 16px 16px;border-radius:var(--r-lg);background:var(--volt);color:var(--on-volt)}
.upgrade::after{content:"";position:absolute;right:-34px;top:-14px;width:130px;height:24px;background:#0D0F0B;transform:rotate(-14deg)}
.upgrade h2{font-size:34px;max-width:13ch}
.upgrade p{font-size:14px;font-weight:550;max-width:40ch}
.upgrade .eyebrow{color:inherit;opacity:.72}
.upgrade .btn-ink{--bg:#0D0F0B;--fg:#F3F4EE;--depth:#46560F;--edge:#0D0F0B}
.upgrade .btn-plain{--bg:transparent;--fg:#0D0F0B;--edge:rgba(13,15,11,.35);--depth:transparent;box-shadow:none;margin-bottom:0}
.danger-zone{display:flex;flex-direction:column;gap:6px}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.lock .i{width:14px;height:14px}

/* ---------- success ---------- */
.done{min-height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:calc(30px + env(safe-area-inset-top)) 22px calc(var(--nav-h) + 50px + env(safe-area-inset-bottom))}
.done.no-nav{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.done-badge{width:104px;height:104px;border-radius:32px;background:var(--volt);color:var(--on-volt);display:grid;place-items:center;box-shadow:0 7px 0 var(--volt-deep);transform:rotate(-6deg);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.done-badge .i{width:58px;height:58px;stroke-width:3}
.done h1{font-size:64px}
.done p{font-size:16px;color:var(--ink-2);max-width:34ch}
@keyframes pop{from{transform:rotate(-6deg) scale(.4);opacity:0}}

/* ---------- filtros: raio e cidade ---------- */
.radius{display:grid;grid-template-columns:minmax(0,1fr) 108px;gap:14px;align-items:end}
.range{-webkit-appearance:none;appearance:none;width:100%;height:54px;margin:0;background:transparent;--p:50%;cursor:pointer}
.range::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(to right,var(--volt) 0 var(--p),var(--raised) var(--p) 100%)}
.range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;margin-top:-11px;border-radius:50%;background:var(--surface);border:3px solid var(--volt);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.range::-moz-range-track{height:8px;border-radius:99px;background:var(--raised)}
.range::-moz-range-progress{height:8px;border-radius:99px;background:var(--volt)}
.range::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--surface);border:3px solid var(--volt)}
.range.off{opacity:.38}
.maxbox{display:flex;flex-direction:column;gap:6px}
.input-wrap.km .input{padding:0 42px 0 14px;text-align:right;font-weight:700}
.input-wrap .post{position:absolute;right:14px;top:0;height:54px;display:flex;align-items:center;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-2);pointer-events:none}
.radius-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.radius-foot .linkbtn{font-size:13px}
.radius-foot .linkbtn.on{color:var(--volt-text);text-decoration:none}
.select-wrap{position:relative}
.select-wrap::after{content:"";position:absolute;right:20px;top:50%;width:8px;height:8px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
select.input{padding-right:46px;cursor:pointer;text-overflow:ellipsis}
select.input option{background:var(--surface);color:var(--ink)}

/* ---------- solicitações, perfil, dicas ---------- */
.modes.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.modes.three button{font-size:13px;gap:5px}
.example-note{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.4;color:var(--ink-2)}
.example-note .i{width:16px;height:16px;margin-top:1px;color:var(--warn)}
.reason.warn{background:var(--warn-bg)}
.reason.warn b{color:var(--warn)}
.avatar,.mini-av{overflow:hidden}
.avatar img,.mini-av img{width:100%;height:100%;object-fit:cover;display:block}
.av-edit{position:relative;flex:none;cursor:pointer;border-radius:22px}
.av-edit input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.av-cam{position:absolute;right:-6px;bottom:-6px;width:32px;height:32px;border-radius:50%;background:var(--volt);color:var(--on-volt);border:3px solid var(--ground);display:grid;place-items:center;pointer-events:none}
.av-cam .i{width:16px;height:16px;stroke-width:2.4}
.group.slim{padding:3px 14px;gap:0}
.setting.sm{min-height:50px}
.setting.sm .txt b{font-size:14.5px}
.switch.sm{width:50px;height:30px}
.switch.sm i{top:4px;left:4px;width:22px;height:22px}
.switch.sm input:checked+i{transform:translateX(20px)}
.empty.sm{padding:22px 16px}
.empty p .i{width:16px;height:16px;vertical-align:-3px}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:15px}
ol.steps li::marker{font-family:var(--mono);font-weight:700;color:var(--volt-text)}
ol.steps .i{width:18px;height:18px;vertical-align:-4px}
</style>

<body>
<div id="app">
  <main id="view" tabindex="-1"></main>
</div>
<nav id="tabbar" class="tabbar" aria-label="Menu principal" hidden></nav>
<button id="fab" class="fab" type="button" aria-label="Nova corrida" hidden></button>
<div id="toastHost" aria-live="polite"></div>
<script>
"use strict";
/* =====================================================================
   KOHE — protótipo HTML (fase de testes, dados salvos só no aparelho)
   ===================================================================== */

/* ---------- utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function distKm(a, b) {
  const R = 6371, rad = x => x * Math.PI / 180;
  const dLa = rad(b.lat - a.lat), dLo = rad(b.lon - a.lon);
  const s = Math.sin(dLa / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

const DOW = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const DOW_FULL = ["domingo", "segunda-feira", "terça-feira", "quarta-feira", "quinta-feira", "sexta-feira", "sábado"];
const MON = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const MON_FULL = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
const pad2 = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const pDate = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d); };
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
function startOf(r) { const d = pDate(r.data); if (r.hora) { const [h, mi] = r.hora.split(":").map(Number); d.setHours(h, mi); } else d.setHours(23, 59); return d; }
const isOver = r => startOf(r) < new Date();
const daysFrom = s => Math.round((pDate(s) - today0()) / 864e5);
function relDay(s) { const n = daysFrom(s); return n === 0 ? "hoje" : n === 1 ? "amanhã" : n < 0 ? (n === -1 ? "ontem" : `há ${-n} dias`) : `em ${n} dias`; }
function fmtLong(s) { const d = pDate(s); return `${DOW_FULL[d.getDay()]}, ${d.getDate()} de ${MON_FULL[d.getMonth()]} de ${d.getFullYear()}`; }
function fmtShort(s) { const d = pDate(s); return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; }
function fmtStamp(iso) { const d = new Date(iso); return `${d.getDate()} ${MON[d.getMonth()]} · ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }

async function hashPass(pass, salt) {
  const data = new TextEncoder().encode(salt + "::" + pass);
  if (window.crypto && crypto.subtle) {
    try { const buf = await crypto.subtle.digest("SHA-256", data); return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join(""); } catch (e) {}
  }
  let h1 = 0x811c9dc5, h2 = 0x9747b28c;
  for (const b of data) { h1 = Math.imul(h1 ^ b, 16777619); h2 = Math.imul(h2 ^ b, 2246822507) ^ (h2 >>> 13); }
  return "f" + (h1 >>> 0).toString(16) + (h2 >>> 0).toString(16);
}

function compressImage(file, { max = 960, q = 0.72, square = false } = {}) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"), x = c.getContext("2d");
      if (square) {
        const s = Math.min(img.width, img.height), size = Math.min(max, s);
        c.width = c.height = size;
        x.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      } else {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        x.drawImage(img, 0, 0, c.width, c.height);
      }
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("imagem")); };
    img.src = url;
  });
}

/* ---------- distâncias e capa da corrida ---------- */
function hashNum(s) { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
const kmOf = m => { const x = String(m).replace(",", ".").match(/\d+(\.\d+)?/); return x ? parseFloat(x[0]) : null; };
const kmList = r => [...new Set((r.mods || []).map(kmOf).filter(v => v != null))];
const kmTxt = n => String(n).replace(".", ",");
function kmRange(r) { const l = kmList(r); return l.length ? { min: Math.min(...l), max: Math.max(...l) } : null; }
// cor pela MAIOR distância: até 5 km branco · até 10 km escuro · acima de 10 km verde
const kmTone = k => !k ? "dark" : k.max <= 5 ? "white" : k.max <= 10 ? "dark" : "green";
function bibHTML(r, big = false) {
  const k = kmRange(r), tone = kmTone(k);
  if (r.arte) return `<img class="art" src="${r.arte}" alt="Arte da corrida">${k ? `<span class="kmtag t-${tone}">${kmTxt(k.min)} km${k.max > k.min ? " · até " + kmTxt(k.max) : ""}</span>` : ""}`;
  const h = hashNum(r.id || r.nome), n = k ? kmTxt(k.min) : "K";
  const ns = big ? (n.length > 2 ? 110 : 136) : (n.length > 2 ? 36 : 46);
  const side = k
    ? `<span class="side"><span class="u">km</span>${k.max > k.min ? `<span class="upto">até<br> ${kmTxt(k.max)} km</span>` : ""}</span>`
    : `<span class="side"><span class="u">kohe</span></span>`;
  return `<div class="bib t-${tone}${big ? " big" : ""}" style="--rot:${-(8 + (h >> 2) % 9)}deg;--y:${12 + (h >> 4) % 30}%;--ns:${ns}px" aria-hidden="true"><i class="pin"></i><i class="pin"></i><i class="pin"></i><i class="pin"></i><div class="row"><span class="n">${esc(n)}</span>${side}</div>${big ? `<div class="nm">${esc(r.nome)}</div>` : ""}</div>`;
}

const defaultFilters = () => ({ kms: [], de: "", ate: "", cidade: "", raio: 0, origem: "perfil", gps: null });
function feedFilters() {
  const f = Object.assign(defaultFilters(), Prefs.d.filtros || {});
  f.kms = (Array.isArray(f.kms) ? f.kms : []).map(Number).filter(n => !isNaN(n));
  delete f.mods;
  f.raio = Math.max(0, parseInt(f.raio, 10) || 0);
  return f;
}
function saveFilters(f) { Prefs.d.filtros = f; Prefs.save(); }
function originPoint(f, u) {
  if (f.origem === "gps" && f.gps) return { lat: f.gps.lat, lon: f.gps.lon, label: "você" };
  const c = findCity(u && u.end && u.end.cidade);
  return c ? { lat: c.lat, lon: c.lon, label: c.n } : null;
}
function publishedUpcoming() {
  return DB.races.filter(r => r.status === "publicada" && !isOver(r))
    .sort((a, b) => startOf(a) - startOf(b) || a.nome.localeCompare(b.nome, "pt-BR"));
}
function filterRaces(list, f, o, skipCity = false) {
  return list.map(r => { const c = findCity(r.cidade); return { r, dist: o && c ? distKm(o, c) : null }; })
    .filter(({ r, dist }) => {
      if (f.kms.length && !kmList(r).some(k => f.kms.includes(k))) return false;
      if (f.de && r.data < f.de) return false;
      if (f.ate && r.data > f.ate) return false;
      if (!skipCity && f.cidade && norm(r.cidade) !== norm(f.cidade)) return false;
      if (f.raio && o && (dist == null || dist > f.raio)) return false;
      return true;
    });
}
function pagerHTML(p, pages) {
  if (pages <= 1) return "";
  let b = `<button type="button" data-page="${p - 1}"${p === 1 ? " disabled" : ""} aria-label="Página anterior">${ic("back")}</button>`;
  for (let i = 1; i <= pages; i++) b += `<button type="button" data-page="${i}"${i === p ? ' class="on" aria-current="page"' : ""}>${i}</button>`;
  b += `<button type="button" data-page="${p + 1}"${p === pages ? " disabled" : ""} aria-label="Próxima página"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>`;
  return `<nav class="pager" aria-label="Páginas do feed">${b}</nav>`;
}

function bindSwipe(view, u) {

function openFilters(u) {
  const f = feedFilters();
  const kms = [...new Set(publishedUpcoming().flatMap(kmList))];
  f.kms.forEach(k => { if (!kms.includes(k)) kms.push(k); });
  kms.sort((a, b) => a - b);
  const prof = findCity(u.end && u.end.cidade);
  const sh = openSheet(`
    <div class="sheet-head"><h2 class="disp">Filtros</h2><button class="icon-btn" type="button" data-close aria-label="Fechar filtros">${ic("x")}</button></div>
    <div class="field"><span class="label">Distância</span>
      <div class="pick" id="fKms">${kms.map(k => `<button type="button" data-k="${k}"${f.kms.includes(k) ? ' class="on" aria-pressed="true"' : ' aria-pressed="false"'}>${kmTxt(k)} km</button>`).join("")}</div>

    <div class="field"><span class="label" id="fRaioLbl">Raio máximo</span>
      <div class="radius">
        <input type="range" class="range" id="fRange" min="5" max="${RAIO_MAX}" step="5" aria-labelledby="fRaioLbl">
        <div class="maxbox"><label class="eyebrow" for="fMax">Máximo</label><div class="input-wrap km"><input id="fMax" class="input" type="text" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="—"><span class="post">km</span></div></div>
      </div>
      <div class="radius-foot"><span class="eyebrow num">5 km</span><button type="button" class="linkbtn" id="fNoLimit">Sem limite</button><span class="eyebrow num">${RAIO_MAX} km</span></div>
      <div class="choice" id="fOrig">
        <button type="button" data-o="perfil">${ic("pin")}<span>${prof ? esc(prof.n) : "Minha cidade"}</span></button>
        <button type="button" data-o="gps">${ic("gps")}<span>Onde estou</span></button>
      </div>
      <div class="hint" id="fHint"></div>
    </div>
    <div class="field"><label for="fCidade">Cidade</label><div class="select-wrap"><select id="fCidade" class="input"></select></div><div class="hint">Só aparecem cidades com corrida dentro dos filtros acima.</div></div>
    <div class="btn-row"><button class="btn" type="button" id="fClear">Limpar</button><button class="btn btn-volt" type="button" id="fApply">Ver corridas</button></div>`);
  const el = sh.el, range = $("#fRange", el), max = $("#fMax", el), sel = $("#fCidade", el);
  const paint = () => {
    f.de = $("#fDe", el).value; f.ate = $("#fAte", el).value;
    const on = f.raio > 0, pos = on ? Math.min(Math.max(f.raio, 5), RAIO_MAX) : RAIO_MAX;
    range.value = pos; range.classList.toggle("off", !on);
    range.style.setProperty("--p", ((pos - 5) / (RAIO_MAX - 5)) * 100 + "%");
    range.setAttribute("aria-valuetext", on ? f.raio + " km" : "Sem limite");
    if (document.activeElement !== max) max.value = on ? String(f.raio) : "";
    $("#fNoLimit", el).classList.toggle("on", !on);
    $("#fOrig", el).hidden = !on;
    $$("#fOrig button", el).forEach(b => b.classList.toggle("on", b.dataset.o === (f.origem === "gps" && f.gps ? "gps" : "perfil")));
    let hint = "Sem limite de distância.";
    if (on) {
      if (f.origem === "gps" && f.gps) hint = "Distância medida a partir de onde você está agora.";
      else if (prof) hint = `Distância medida a partir de ${esc(prof.n)}, a cidade do seu cadastro.`;
      else hint = "A cidade do seu cadastro não está na lista do Kohe. Toque em “Onde estou” para usar o GPS.";
      hint += " Corridas em cidades fora da lista ficam de fora com o raio ligado.";
    }
    $("#fHint", el).innerHTML = hint;
    const o = originPoint(f, u);
    const base = filterRaces(publishedUpcoming(), f, o, true), counts = {};
    base.forEach(({ r }) => { const c = findCity(r.cidade), n = c ? c.n : r.cidade; counts[n] = (counts[n] || 0) + 1; });
    const names = Object.keys(counts).sort((a, b) => a.localeCompare(b, "pt-BR"));
    if (f.cidade && !names.includes(f.cidade)) f.cidade = "";
    sel.innerHTML = `<option value="">Todas as cidades (${base.length})</option>` + names.map(n => `<option value="${esc(n)}"${n === f.cidade ? " selected" : ""}>${esc(n)} (${counts[n]})</option>`).join("");
    const total = filterRaces(publishedUpcoming(), f, o).length;
    $("#fApply", el).textContent = total ? `Ver ${total} corrida${total === 1 ? "" : "s"}` : "Nenhuma corrida";
  };
  $("#fKms", el).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const k = +b.dataset.k, on = !f.kms.includes(k);
    f.kms = on ? [...f.kms, k] : f.kms.filter(x => x !== k);
    b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); paint();
  });
  range.addEventListener("input", () => { f.raio = +range.value; paint(); });
  max.addEventListener("input", () => { max.value = max.value.replace(/\D/g, "").slice(0, 4); f.raio = parseInt(max.value, 10) || 0; paint(); });
  max.addEventListener("blur", paint);
  $("#fNoLimit", el).addEventListener("click", () => { f.raio = 0; max.value = ""; paint(); });
  $("#fOrig", el).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.o === "perfil") { f.origem = "perfil"; paint(); return; }
    if (!navigator.geolocation) { toast("Este navegador não libera a localização.", true); return; }
    $("#fHint", el).textContent = "Buscando sua localização…";
    navigator.geolocation.getCurrentPosition(
      pos => { f.origem = "gps"; f.gps = { lat: pos.coords.latitude, lon: pos.coords.longitude }; paint(); },
      () => { f.origem = "perfil"; paint(); toast("Não deu para acessar a localização. Usando a cidade do cadastro.", true); },
      { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 });
  });
  ["fDe", "fAte"].forEach(id => ["input", "change"].forEach(ev => $("#" + id, el).addEventListener(ev, paint)));
  sel.addEventListener("change", () => { f.cidade = sel.value; paint(); });
  $("#fClear", el).addEventListener("click", () => { saveFilters(defaultFilters()); sh.close(); go("/feed"); });
  $("#fApply", el).addEventListener("click", () => {
    f.de = $("#fDe", el).value; f.ate = $("#fAte", el).value;
    if (f.de && f.ate && f.ate < f.de) { bad("fAte"); goFirstBad(el); return; }
    saveFilters(f); sh.close(); go("/feed");
  });
  paint();
}

const fixUrl = v => { v = String(v || "").trim(); if (v && !/^https?:\/\//i.test(v)) v = "https://" + v; return v; };
const urlOk = v => { try { const x = new URL(v); return /^https?:$/.test(x.protocol) && x.hostname.includes("."); } catch (e) { return false; } };
const hostOf = v => { try { return new URL(v).hostname.replace(/^www\./, ""); } catch (e) { return v; } };

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {
    const ta = document.createElement("textarea"); ta.value = t; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (err) {}
    ta.remove(); return ok;
  }
}
document.addEventListener("click", async e => {
  const b = e.target.closest && e.target.closest("[data-copy]"); if (!b) return;

const MOD_PRESETS = ["3 km", "5 km", "6 km", "7 km", "8 km", "10 km", "15 km", "21 km", "42 km"];
const normMod = s => {
  s = String(s).trim().replace(/\s+/g, " "); if (!s) return "";
  const m = s.match(/^(\d+(?:[.,]\d+)?)\s*(k|km)?$/i);
  if (m) return m[1].replace(".", ",") + " km";
  s = s.replace(/(\d)\s*(k|km)\b/gi, "$1 km");
  return s.charAt(0).toUpperCase() + s.slice(1);
};
const parseBRL = v => { const n = parseFloat(String(v).replace(/[^\d,.-]/g, "").replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", ".")); return isNaN(n) ? null : Math.round(n * 100) / 100; };
function draftFromRace(r) {
  return {
    id: r.id, tmpId: r.id, nome: r.nome, cidade: r.cidade, rua: r.rua || "", data: r.data, hora: r.hora || "",
    mods: [...r.mods], preco: hasPrice(r) ? String(r.preco).replace(".", ",") : "",
    inscTipo: (r.insc && r.insc.tipo) || "site", url: (r.insc && r.insc.url) || "", app: (r.insc && r.insc.app) || "",
    desc: r.desc || "", cupom: r.cupom || "", arte: r.arte || null
  };
}
function fieldsFromDraft(d) {
  const c = findCity(d.cidade);
  return {
    nome: d.nome, cidade: c ? c.n : d.cidade, rua: d.rua, data: d.data, hora: d.hora, mods: [...d.mods],
    preco: parseBRL(d.preco), insc: { tipo: d.inscTipo, url: d.url, app: d.inscTipo === "app" ? d.app : "", plataforma: "" },
    desc: d.desc, cupom: (d.cupom || "").toUpperCase(), arte: d.arte || null

}

  $("#modOther").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); addMod(); } });
  $("#inscTipo").addEventListener("click", e => { const b = e.target.closest("button"); if (!b || b.dataset.t === d.inscTipo) return; collect(); d.inscTipo = b.dataset.t; rerender(); });
  $("#arteIn").addEventListener("change", async e => {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    try { d.arte = await compressImage(file); rerender(); toast("Arte adicionada."); }
    catch (err) { toast("Não deu para ler essa imagem. Tente um JPG ou PNG.", true); }
  });
  const rm = $("#arteRm"); if (rm) rm.addEventListener("click", () => { d.arte = null; rerender(); });

  $("#rf").addEventListener("submit", e => {
    e.preventDefault(); collect();
    if (!d.nome || d.nome.length < 3) bad("rf_nome");
    const now = new Date();
    if (!d.data) bad("rf_data");
    else if (d.data < ymd(now)) bad("rf_data", "Essa data já passou.");
    if (!d.hora) bad("rf_hora");
    else if (d.data === ymd(now) && d.hora <= `${pad2(now.getHours())}:${pad2(now.getMinutes())}`) bad("rf_hora", "Esse horário já passou.");
    if (!d.cidade) bad("rf_cidade");
    if (!d.rua) bad("rf_rua");
    if (!d.mods.length) bad("rf_mods");
    const p = parseBRL(d.preco);
    if (!d.preco) bad("rf_preco"); else if (p == null || p < 0) bad("rf_preco", "Use só números. Ex.: 5 ou 89,90");
    if (d.inscTipo === "app") {
      if (!d.app) bad("rf_app");
      if (d.url) { d.url = fixUrl(d.url); if (!urlOk(d.url)) bad("rf_url"); }
    } else {
      if (!d.url) bad("rf_url");
      else { d.url = fixUrl(d.url); if (!urlOk(d.url)) bad("rf_url", "Esse link não parece válido. Ex.: https://site.com/inscricao"); }
    }
    if (!d.desc) bad("rf_desc"); else if (d.desc.length < 10) bad("rf_desc", "Escreva pelo menos 10 caracteres.");
    if (goFirstBad(view)) return;
    saveDraft();
    go("/revisao");
  });
}, { tab: "sol", roles: ["organizador", "admin"] });

route(/^\/revisao$/, function vReview(view, _, q, u) {
  const d = SS.get("kohe.draft");
  if (!d || !d.nome) return redirect("/nova");
  const admin = isAdmin(u), editHref = "#/nova" + (d.id ? "?editar=" + d.id : "");
  const r = Object.assign({ id: d.tmpId, autor: u.id, status: admin ? "publicada" : "pendente" }, fieldsFromDraft(d));
  view.innerHTML = `
    <header class="topbar"><div class="topbar-in">
      <a class="icon-btn" href="${editHref}" aria-label="Voltar e editar">${ic("back")}</a>
      <div class="t"><span class="eyebrow">Conferência</span><h1 class="disp" style="font-size:30px">Confira os dados</h1></div>
      <span class="eyebrow num">2/2</span>
    </div></header>
    <section class="page" style="gap:18px">
      <div class="review-banner">${ic("alert")}<p>É assim que a corrida vai aparecer no feed${admin ? "" : " depois de aprovada"}. Viu algo errado? Volte e edite antes de ${admin ? "publicar" : "enviar"}.</p></div>
      <div class="cover" style="border-radius:var(--r-lg);height:280px">${bibHTML(r, true)}</div>
      ${raceBodyHTML(r, u, { preview: true })}
      <div class="actionbar">
        <button class="btn btn-volt btn-block" type="button" id="send">${admin ? "Publicar corrida" : d.id ? "Reenviar para aprovação" : "Enviar para aprovação"} ${ic("send")}</button>
        <a class="btn btn-block" href="${editHref}">${ic("edit")} Voltar e editar</a>
      </div>
    </section>`;
  $("#send").addEventListener("click", () => {
    const t = new Date().toISOString(); let id;
    if (d.id) {
      const o = DB.races.find(x => x.id === d.id);
      if (!o || o.status !== "negada" || o.envios >= MAX_ENVIOS) { toast("Essa corrida não pode mais ser reenviada.", true); return go("/solicitacoes"); }
      const backup = JSON.stringify(o);
      Object.assign(o, fieldsFromDraft(d), { status: "pendente", envios: o.envios + 1 });
      o.hist.push({ t, acao: "reenviada", por: u.id });
      if (!DB.save()) { Object.assign(o, JSON.parse(backup)); return; }
      id = o.id;
    } else {
      const race = Object.assign({ id: d.tmpId, autor: u.id, criado: t, envios: 1, motivo: "", status: admin ? "publicada" : "pendente", hist: [{ t, acao: admin ? "publicada" : "enviada", por: u.id }] }, fieldsFromDraft(d));
      DB.races.push(race);
      if (!DB.save()) { DB.races.pop(); return; }
      id = race.id;
    }
    SS.del("kohe.draft");
    go("/enviada/" + id);
  });
}, { tab: "sol", roles: ["organizador", "admin"] });
