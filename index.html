/* =====================================================================
   TELAS — solicitações (organizador) e aprovações (admin)
   ===================================================================== */
async function askDeletion(r, u) {
  const motivo = await confirmBox({
    title: "Pedir exclusão", ok: "Enviar pedido", danger: true,
    text: `A administração decide se <b>${esc(r.nome)}</b> sai do Kohe. Até lá, nada muda para quem vê a corrida.`,
    reason: { label: "Por que excluir?", min: MIN_JUST, placeholder: "Ex.: a organização cancelou a prova." }
  });
  if (!motivo) return;
  const t = new Date().toISOString();
  r.pedidoExclusao = { t, por: u.id, motivo, status: "pendente" };
  r.hist.push({ t, acao: "exclusao-pedida", por: u.id, obs: motivo });
  DB.save(); render(); toast("Pedido de exclusão enviado para a administração.");
}
const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;

function myReqCard(r, admin) {
  const st = raceState(r), left = MAX_ENVIOS - r.envios, pe = r.pedidoExclusao;
  const sent = lastEvent(r, "enviada", "reenviada", "publicada");
  let foot = "";
  if (st === "pendente") foot = `${r.envios}º envio · ${sent ? fmtStamp(sent.t) : ""}`;
  else if (st === "publicada") foot = `No feed · largada ${relDay(r.data)}`;
  else if (st === "finalizada") foot = "Saiu do feed: a data já passou";
  else if (st === "negada") foot = left > 0 ? `${plural(left, "reenvio restante", "reenvios restantes")}` : "Limite de reenvios atingido";
  else if (st === "excluida") foot = `Excluída · some em ${plural(diasRestantes(r), "dia", "dias")}`;
  const delWaiting = pe && pe.status === "pendente" && st !== "excluida";
  const canAskDel = !admin && (st === "publicada" || st === "pendente") && !delWaiting;
  return `<article class="req">
    <div class="req-top"><div class="form" style="gap:5px;min-width:0"><span class="meta">${fmtShort(r.data)} · ${r.hora || "hora a confirmar"} · ${esc(r.cidade)}</span><h3>${esc(r.nome)}</h3></div>${stPill(st)}</div>
    ${st === "negada" && r.motivo ? `<div class="reason"><b>Motivo da negativa</b>${esc(r.motivo)}</div>` : ""}
    ${delWaiting ? `<div class="reason warn"><b>Exclusão solicitada · aguardando</b>${esc(pe.motivo)}</div>` : ""}
    ${pe && pe.status === "negado" && st !== "excluida" ? `<p class="eyebrow">Pedido de exclusão recusado em ${fmtStamp(pe.decidido)}</p>` : ""}
    ${st === "excluida" && r.exclusao.motivo ? `<div class="reason"><b>Motivo da exclusão</b>${esc(r.exclusao.motivo)}</div>` : ""}
    <div class="req-top" style="align-items:center">
      <span class="eyebrow">${foot}</span>
      <div class="btn-row" style="flex:none">
        <a class="btn btn-sm" href="#/corrida/${r.id}?de=sol">Ver</a>
        ${st === "negada" && left > 0 ? `<a class="btn btn-sm btn-volt" href="#/nova?editar=${r.id}">${ic("edit")} Editar e reenviar</a>` : ""}
      </div>
    </div>
    ${canAskDel ? `<button class="linkbtn" type="button" data-askdel="${r.id}" style="align-self:flex-start;font-size:13px;color:var(--danger)">${ic("trash")} Pedir exclusão desta corrida</button>` : ""}
  </article>`;
}

function excludedCard(r) {
  const by = userById(r.exclusao.por), pe = r.pedidoExclusao, asker = pe && userById(pe.por);
  return `<article class="req">
    <div class="req-top"><div class="form" style="gap:5px;min-width:0"><span class="meta">${fmtShort(r.data)} · ${r.hora || "hora a confirmar"} · ${esc(r.cidade)}</span><h3>${esc(r.nome)}</h3></div>${stPill("excluida")}</div>
    <p class="eyebrow">Excluída ${fmtStamp(r.exclusao.t)} por @${esc(by ? by.nick : "?")}${r.exclusao.via === "pedido" && asker ? ` a pedido de @${esc(asker.nick)}` : ""}</p>
    ${r.exclusao.motivo ? `<div class="reason"><b>Justificativa</b>${esc(r.exclusao.motivo)}</div>` : ""}
    <div class="req-top" style="align-items:center">
      <span class="eyebrow">Some em ${plural(diasRestantes(r), "dia", "dias")}</span>
      <div class="btn-row" style="flex:none"><a class="btn btn-sm" href="#/corrida/${r.id}?de=sol">Ver</a><button class="btn btn-sm btn-volt" type="button" data-restore="${r.id}">${ic("refresh")} Restaurar</button></div>
    </div>
  </article>`;
}

route(/^\/solicitacoes$/, function vRequests(view, _, q, u) {
  purgeExcluded();
  const admin = isAdmin(u), nPend = pendingCount();
  const nEx = DB.races.filter(r => r.status === "excluida").length;
  const MODES = ["aprovar", "minhas", "excluidas"];
  const mode = admin ? (MODES.includes(q.get("ver")) ? q.get("ver") : (nPend ? "aprovar" : "minhas")) : "minhas";
  const evT = (r, ...a) => (lastEvent(r, ...a) || (r.hist || [])[0] || { t: r.criado || "" }).t;
  let body = "";

  if (mode === "minhas") {
    const G = { pendente: [], publicada: [], finalizada: [], negada: [], excluida: [] };
    DB.races.filter(r => r.autor === u.id).forEach(r => { const s = raceState(r); if (G[s]) G[s].push(r); });
    G.pendente.sort((a, b) => evT(b, "enviada", "reenviada").localeCompare(evT(a, "enviada", "reenviada")));
    G.publicada.sort((a, b) => startOf(a) - startOf(b));
    G.finalizada.sort((a, b) => startOf(b) - startOf(a));
    G.negada.sort((a, b) => evT(b, "negada").localeCompare(evT(a, "negada")));
    G.excluida.sort((a, b) => b.exclusao.t.localeCompare(a.exclusao.t));
    const TABS = [["pendente", "Aguardando"], ["publicada", "Publicadas"], ["finalizada", "Finalizadas"], ["negada", "Negadas"]];
    if (!admin && G.excluida.length) TABS.push(["excluida", "Excluídas"]);
    const aba = TABS.some(([k]) => k === q.get("aba")) ? q.get("aba") : (TABS.find(([k]) => G[k].length) || TABS[0])[0];
    const EMPTY = {
      pendente: ["Nada na fila", "Corridas que você enviar ficam aqui até a administração decidir."],
      publicada: ["Nenhuma no feed", "Quando uma corrida sua for aprovada, ela aparece aqui e no feed."],
      finalizada: ["Nenhuma finalizada", "Corridas publicadas vêm para cá depois que a data passa."],
      negada: ["Nenhuma negada", "Se uma corrida for negada, você vê o motivo aqui e pode editar e reenviar."],
      excluida: ["Nenhuma excluída", ""]
    };
    body = `
      <div class="seg" role="tablist">${TABS.map(([k, l]) => `<button type="button" role="tab" data-aba="${k}"${k === aba ? ' class="on" aria-selected="true"' : ""}>${l}<span class="ct num">${G[k].length}</span></button>`).join("")}</div>
      ${G[aba].length ? G[aba].map(r => myReqCard(r, admin)).join("")
        : `<div class="empty"><h3>${EMPTY[aba][0]}</h3><p>${EMPTY[aba][1]}</p>${aba === "pendente" ? `<a class="btn btn-sm btn-volt" href="#/nova">${ic("plus")} ${admin ? "Cadastrar corrida" : "Solicitar corrida"}</a>` : ""}</div>`}`;
  } else if (mode === "aprovar") {
    const races = DB.races.filter(r => r.status === "pendente").sort((a, b) => evT(a, "enviada", "reenviada").localeCompare(evT(b, "enviada", "reenviada")));
    const dels = DB.races.filter(delPending).sort((a, b) => a.pedidoExclusao.t.localeCompare(b.pedidoExclusao.t));
    const ups = DB.ups.filter(x => x.status === "pendente").sort((a, b) => a.criado.localeCompare(b.criado));
    body = `
      <div class="section-title"><h2 class="disp">Corridas</h2><span class="eyebrow num">${races.length} na fila</span></div>
      ${races.length ? races.map(r => {
        const a = userById(r.autor), sent = lastEvent(r, "enviada", "reenviada");
        return `<article class="req">
          <div class="req-top"><div class="form" style="gap:5px;min-width:0"><span class="meta">${fmtShort(r.data)} · ${r.hora || "hora a confirmar"} · ${esc(r.cidade)}</span><h3>${esc(r.nome)}</h3></div><span class="st st-pend">${r.envios > 1 ? r.envios + "º envio" : "Novo"}</span></div>
          <div class="byline">${avatarHTML(a, "mini-av")}<span><b>@${esc(a ? a.nick : "conta excluída")}</b> · ${sent ? fmtStamp(sent.t) : ""}</span></div>
          <a class="btn btn-sm btn-volt btn-block" href="#/aprovar/${r.id}">Conferir e decidir ${ic("arrow")}</a>
        </article>`;
      }).join("") : `<div class="empty sm"><h3>Fila zerada</h3><p>Nenhuma corrida esperando aprovação agora.</p></div>`}
      <div class="section-title"><h2 class="disp">Exclusões</h2><span class="eyebrow num">${plural(dels.length, "pedido", "pedidos")}</span></div>
      ${dels.length ? dels.map(r => {
        const a = userById(r.pedidoExclusao.por);
        return `<article class="req">
          <div class="req-top"><div class="form" style="gap:5px;min-width:0"><span class="meta">${fmtShort(r.data)} · ${r.hora || "hora a confirmar"} · ${esc(r.cidade)}</span><h3>${esc(r.nome)}</h3></div>${stPill(raceState(r))}</div>
          <div class="byline">${avatarHTML(a, "mini-av")}<span><b>@${esc(a ? a.nick : "conta excluída")}</b> · ${fmtStamp(r.pedidoExclusao.t)}</span></div>
          <div class="reason warn"><b>Justificativa</b>${esc(r.pedidoExclusao.motivo)}</div>
          <div class="btn-row"><a class="btn btn-sm" href="#/corrida/${r.id}?de=sol">Ver</a><button class="btn btn-sm" type="button" data-dkeep="${r.id}">Manter</button><button class="btn btn-sm btn-danger" type="button" data-dok="${r.id}">Excluir</button></div>
        </article>`;
      }).join("") : `<div class="empty sm"><h3>Sem pedidos</h3><p>Pedidos de exclusão feitos por organizadores aparecem aqui.</p></div>`}
      <div class="section-title"><h2 class="disp">Perfis</h2><span class="eyebrow num">${plural(ups.length, "pedido", "pedidos")}</span></div>
      ${ups.length ? ups.map(x => {
        const p = userById(x.uid);
        return `<article class="req">
          <div class="person">${avatarHTML(p, "avatar", "width:48px;height:48px;border-radius:15px;font-size:22px")}<div class="who"><b>${esc(p ? p.nome : "Conta excluída")}</b><span>@${esc(p ? p.nick : "?")} · ${esc(p ? p.email : "")}</span></div></div>
          <div class="arrow-roles"><span class="role usuario">${ROLE_LABEL[x.de]}</span>${ic("arrow")}<span class="role">${ROLE_LABEL[x.para]}</span></div>
          <p class="eyebrow">Pedido em ${fmtStamp(x.criado)}${p && p.end ? " · " + esc(p.end.cidade) : ""}</p>
          <div class="btn-row"><button class="btn btn-sm btn-outline-danger" type="button" data-updeny="${x.id}">Negar</button><button class="btn btn-sm btn-volt" type="button" data-upok="${x.id}">${ic("check")} Aprovar</button></div>
        </article>`;
      }).join("") : `<div class="empty sm"><h3>Sem pedidos</h3><p>Pedidos de upgrade para organizador ou administrador aparecem aqui.</p></div>`}`;
  } else {
    const ex = DB.races.filter(r => r.status === "excluida").sort((a, b) => b.exclusao.t.localeCompare(a.exclusao.t));
    body = `
      <p class="muted" style="font-size:13.5px">Corridas excluídas ficam aqui por ${EXCLUIDA_DIAS} dias. Depois disso, somem de vez.</p>
      ${ex.length ? ex.map(excludedCard).join("") : `<div class="empty"><h3>Nada excluído</h3><p>Corridas excluídas do feed aparecem aqui e podem ser restauradas.</p></div>`}`;
  }

  view.innerHTML = `
    <header class="topbar"><div class="topbar-in"><div class="t"><span class="eyebrow">${admin ? "Administração" : "Organizador"}</span><h1 class="disp" style="font-size:30px">Solicitações</h1></div></div></header>
    <section class="page">
      ${admin ? `<div class="modes three" role="tablist">
        <button type="button" role="tab" data-mode="aprovar"${mode === "aprovar" ? ' class="on" aria-selected="true"' : ""}>Aprovar${nPend ? `<span class="badge">${nPend}</span>` : ""}</button>
        <button type="button" role="tab" data-mode="minhas"${mode === "minhas" ? ' class="on" aria-selected="true"' : ""}>Minhas</button>
        <button type="button" role="tab" data-mode="excluidas"${mode === "excluidas" ? ' class="on" aria-selected="true"' : ""}>Excluídas${nEx ? ` (${nEx})` : ""}</button>
      </div>` : ""}
      ${body}
    </section>`;

  $$("[data-mode]", view).forEach(b => b.addEventListener("click", () => redirect("/solicitacoes?ver=" + b.dataset.mode)));
  $$("[data-aba]", view).forEach(b => b.addEventListener("click", () => redirect(`/solicitacoes?ver=minhas&aba=${b.dataset.aba}`)));
  $$("[data-askdel]", view).forEach(b => b.addEventListener("click", () => { const r = DB.races.find(x => x.id === b.dataset.askdel); if (r) askDeletion(r, u); }));
  $$("[data-restore]", view).forEach(b => b.addEventListener("click", async () => {
    const r = DB.races.find(x => x.id === b.dataset.restore); if (!r) return;
    const ok = await confirmBox({ title: "Restaurar corrida?", ok: "Restaurar", text: `<b>${esc(r.nome)}</b> volta para ${r.exclusao && r.exclusao.antes === "pendente" ? "a fila de aprovação" : "o feed"}.` });
    if (!ok) return;
    restoreRace(r, u); DB.save(); render(); toast("Corrida restaurada.");
  }));
  $$("[data-dok]", view).forEach(b => b.addEventListener("click", async () => {
    const r = DB.races.find(x => x.id === b.dataset.dok); if (!r || !delPending(r)) return;
    const ok = await confirmBox({ title: "Excluir corrida?", ok: "Excluir", danger: true, text: `<b>${esc(r.nome)}</b> sai do Kohe e fica ${EXCLUIDA_DIAS} dias em Excluídas, onde dá para restaurar.` });
    if (!ok) return;
    excludeRace(r, u, r.pedidoExclusao.motivo, "pedido"); DB.save(); render(); toast("Corrida excluída.");
  }));
  $$("[data-dkeep]", view).forEach(b => b.addEventListener("click", async () => {
    const r = DB.races.find(x => x.id === b.dataset.dkeep); if (!r || !delPending(r)) return;
    const ok = await confirmBox({ title: "Manter corrida?", ok: "Manter", text: `O pedido de exclusão é recusado e <b>${esc(r.nome)}</b> continua no Kohe.` });
    if (!ok) return;
    const t = new Date().toISOString();
    Object.assign(r.pedidoExclusao, { status: "negado", decidido: t, decididoPor: u.id });
    r.hist.push({ t, acao: "exclusao-recusada", por: u.id });
    DB.save(); render(); toast("Pedido recusado. A corrida continua no Kohe.");
  }));
  $$("[data-upok]", view).forEach(b => b.addEventListener("click", async () => {
    const x = DB.ups.find(y => y.id === b.dataset.upok), p = x && userById(x.uid);
    if (!x) return;
    const ok = await confirmBox({ title: "Aprovar pedido?", ok: "Aprovar", text: p ? `<b>@${esc(p.nick)}</b> passa a ser <b>${ROLE_LABEL[x.para]}</b>.` : "A conta foi excluída; o pedido será encerrado." });
    if (!ok) return;
    x.decidido = new Date().toISOString(); x.por = u.id;
    if (p && p.role === x.de) { p.role = x.para; x.status = "aprovada"; } else x.status = "cancelada";
    DB.save(); render(); toast(x.status === "aprovada" ? `@${p.nick} agora é ${ROLE_LABEL[x.para]}.` : "Pedido encerrado.");
  }));
  $$("[data-updeny]", view).forEach(b => b.addEventListener("click", async () => {
    const x = DB.ups.find(y => y.id === b.dataset.updeny), p = x && userById(x.uid);
    if (!x) return;
    const ok = await confirmBox({ title: "Negar pedido?", ok: "Negar", danger: true, text: `${p ? `<b>@${esc(p.nick)}</b> continua como ${ROLE_LABEL[x.de]}` : "O pedido será encerrado"} e pode pedir de novo depois.` });
    if (!ok) return;
    x.status = "negada"; x.decidido = new Date().toISOString(); x.por = u.id;
    DB.save(); render(); toast("Pedido negado.");
  }));
}, { tab: "sol", roles: ["organizador", "admin"] });

route(/^\/aprovar\/([\w-]+)$/, function vApprove(view, [id], q, u) {
  const r = DB.races.find(x => x.id === id && x.status === "pendente");
  if (!r) { view.innerHTML = notFoundHTML("Nada para decidir", "Essa solicitação já foi decidida ou não existe mais.", "#/solicitacoes?ver=aprovar", "Voltar às solicitações"); return; }
  const a = userById(r.autor), prevDeny = lastEvent(r, "negada"), left = MAX_ENVIOS - r.envios;
  view.innerHTML = `
    <header class="topbar"><div class="topbar-in">
      <a class="icon-btn" href="#/solicitacoes?ver=aprovar" aria-label="Voltar">${ic("back")}</a>
      <div class="t"><span class="eyebrow">${r.envios}º envio de ${MAX_ENVIOS}</span><h1 class="disp" style="font-size:30px">Conferir corrida</h1></div>
    </div></header>
    <section class="page" style="gap:18px">
      ${isOver(r) ? `<div class="note">${ic("alert")}<span>A data dessa corrida já passou. Se aprovar, ela vai direto para Finalizadas.</span></div>` : ""}
      ${prevDeny ? `<div class="reason"><b>Negada antes por este motivo</b>${esc(prevDeny.obs || "")}</div>` : ""}
      <div class="cover" style="border-radius:var(--r-lg);height:280px">${bibHTML(r, true)}</div>
      ${raceBodyHTML(r, u, { preview: true })}
      <div class="group">
        <span class="eyebrow">Quem solicitou</span>
        <div class="person">${avatarHTML(a, "avatar", "width:48px;height:48px;border-radius:15px;font-size:22px")}<div class="who"><b>${esc(a ? a.nome : "Conta excluída")}</b><span>@${esc(a ? a.nick : "?")}${a ? " · " + esc(a.email) : ""}</span>${a ? `<span>${esc(a.tel)}</span>` : ""}</div></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-outline-danger" type="button" id="deny">${ic("x")} Negar</button>
        <button class="btn btn-volt" type="button" id="approve">${ic("check")} Aprovar</button>
      </div>
    </section>`;
  $("#approve").addEventListener("click", async () => {
    const ok = await confirmBox({ title: "Aprovar corrida?", ok: "Aprovar", text: `<b>${esc(r.nome)}</b> entra no feed para todos os perfis.` });
    if (!ok) return;
    r.status = "publicada"; r.motivo = "";
    r.hist.push({ t: new Date().toISOString(), acao: "aprovada", por: u.id });
    DB.save(); toast("Corrida aprovada e publicada no feed."); go("/solicitacoes?ver=aprovar");
  });
  $("#deny").addEventListener("click", async () => {
    const motivo = await confirmBox({
      title: "Negar corrida", ok: "Negar", danger: true,
      text: `Diga ao organizador o que precisa ser corrigido. ${left > 0 ? `Ele ainda pode reenviar ${left} vez${left === 1 ? "" : "es"}.` : "Este foi o último envio permitido."}`,
      reason: { label: "Motivo da negativa", min: MIN_MOTIVO, placeholder: "Ex.: o link de inscrição não abre e o horário está diferente do site oficial." }
    });
    if (!motivo) return;
    r.status = "negada"; r.motivo = motivo;
    r.hist.push({ t: new Date().toISOString(), acao: "negada", por: u.id, obs: motivo });
    DB.save(); toast("Corrida negada. O organizador vai ver o motivo."); go("/solicitacoes?ver=aprovar");
  });
}, { tab: "sol", roles: ["admin"] });
/* =====================================================================
   TELAS — perfil e configurações
   ===================================================================== */
const UPGRADE_COPY = {
  organizador: "Organizadores solicitam o cadastro de corridas no Kohe.",
  admin: "Administradores aprovam corridas e pedidos de perfil, e podem excluir corridas do feed."
};
route(/^\/perfil$/, function vProfile(view, _, q, u) {
  const next = NEXT_ROLE[u.role];
  const last = DB.ups.filter(x => x.uid === u.id).sort((a, b) => b.criado.localeCompare(a.criado))[0];
  const pend = last && last.status === "pendente" ? last : null;
  const e = u.end || {};
  const favRaces = favsOf(u).map(id => DB.races.find(r => r.id === id)).filter(r => r && r.status === "publicada");
  const favList = [
    ...favRaces.filter(r => !isOver(r)).sort((a, b) => startOf(a) - startOf(b)),
    ...favRaces.filter(isOver).sort((a, b) => startOf(b) - startOf(a))
  ];
  let upgrade = "";
  if (pend) upgrade = `<div class="upgrade">
      <span class="eyebrow">Pedido enviado ${fmtStamp(pend.criado)}</span>
      <h2 class="disp">Aguardando aprovação</h2>
      <p>Seu pedido para virar ${ROLE_LABEL[pend.para]} está com a administração. Enquanto isso, o app segue igual para você.</p>
      <button class="btn btn-sm btn-plain" type="button" id="cancelUp" style="align-self:flex-start">Cancelar pedido</button>
    </div>`;
  else if (next) upgrade = `<div class="upgrade">
      <span class="eyebrow">${last && last.status === "negada" ? `Último pedido negado em ${fmtStamp(last.decidido)}` : "Upgrade de perfil"}</span>
      <h2 class="disp">Quero ser ${ROLE_LABEL[next]}</h2>
      <p>${UPGRADE_COPY[next]}</p>
      <button class="btn btn-ink btn-block" type="button" id="askUp">Solicitar upgrade ${ic("arrow")}</button>
    </div>`;

  view.innerHTML = `
    <header class="topbar"><div class="topbar-in">
      <div class="t"><span class="eyebrow">Configurações</span><h1 class="disp" style="font-size:30px">Perfil</h1></div>
      <button class="icon-btn" type="button" id="logout" aria-label="Sair da conta">${ic("logout")}</button>
    </div></header>
    <section class="page">
      <div class="me">
        <label class="av-edit">${avatarHTML(u)}<span class="av-cam">${ic("camera")}</span><input type="file" id="fotoIn" accept="image/*" aria-label="${u.foto ? "Trocar foto de perfil" : "Adicionar foto de perfil"}"></label>
        <div class="who">
          <h1 class="disp">@${esc(u.nick)}</h1>
          <span class="role ${u.role}">${ic(u.role === "admin" ? "shield" : u.role === "organizador" ? "flag" : "user")}${ROLE_LABEL[u.role]}</span>
          ${u.foto ? `<button class="linkbtn" type="button" id="fotoRm" style="font-size:13px;min-height:32px;align-self:flex-start">Remover foto</button>` : ""}
        </div>
      </div>
      <div class="group slim">
        <div class="setting sm">
          <span class="txt"><b>Modo noturno</b></span>
          <label class="switch sm"><input type="checkbox" role="switch" id="darkSw"${isDark() ? " checked" : ""} aria-label="Modo noturno"><i></i></label>
        </div>
      </div>
      <div class="section-title"><h2 class="disp">Favoritas</h2><span class="eyebrow num">${favList.length}</span></div>
      ${favList.length ? favList.map(r => raceCard(r, u, null, { date: true, from: "perfil" })).join("")
        : `<div class="empty sm"><p>Toque no ${ic("heart")} de uma corrida para guardar aqui.</p></div>`}
      <div class="group">
        <h2 class="disp">Seus dados</h2>
        <form class="form" id="pf" novalidate>
          <div class="field"><label for="pfNick">Nickname</label><input id="pfNick" class="input" value="@${esc(u.nick)}" readonly><span class="lock">${ic("lock")} Não é possível alterar</span></div>
          <div class="field"><label for="pfEmail">E-mail</label><input id="pfEmail" class="input" value="${esc(u.email)}" readonly><span class="lock">${ic("lock")} Não é possível alterar</span></div>
          ${F({ id: "pf_nome", label: "Nome", value: u.nome, attrs: 'autocomplete="name"', err: "Informe seu nome." })}
          ${F({ id: "pf_tel", label: "Celular com DDD", type: "tel", value: u.tel, attrs: 'autocomplete="tel" inputmode="tel"', err: "Informe o celular com DDD." })}
          ${F({ id: "pf_nasc", label: "Data de nascimento", type: "date", value: u.nasc, attrs: `max="${ymd(new Date())}"`, err: "Informe sua data de nascimento." })}
          <div class="row-num">${F({ id: "pf_rua", label: "Rua", value: e.rua, err: "Informe a rua." })}${F({ id: "pf_num", label: "Número", value: e.num, attrs: 'inputmode="numeric"', err: "Informe o nº." })}</div>
          ${F({ id: "pf_bairro", label: "Bairro", value: e.bairro, err: "Informe o bairro." })}
          ${F({ id: "pf_cidade", label: "Cidade", value: e.cidade, wrap: "city", err: "Informe a cidade." })}
          <button class="btn btn-volt btn-block" type="submit">Salvar alterações</button>
        </form>
      </div>
      <div class="group">
        <h2 class="disp">Senha</h2>
        <form class="form" id="pwf" novalidate>
          ${F({ id: "pw_old", label: "Senha atual", type: "password", wrap: "eye", attrs: 'autocomplete="current-password"', err: "Informe a senha atual." })}
          ${F({ id: "pw_new", label: "Nova senha", type: "password", wrap: "eye", attrs: 'autocomplete="new-password"', err: "Crie a nova senha." })}
          <ul class="rules" id="pwRules">${rulesHTML("")}</ul>
          ${F({ id: "pw_new2", label: "Confirme a nova senha", type: "password", wrap: "eye", attrs: 'autocomplete="new-password"', err: "Repita a nova senha." })}
          <button class="btn btn-block" type="submit">${ic("key")} Trocar senha</button>
        </form>
      </div>
      <div class="group danger-zone">
        <h2 class="disp">Conta</h2>
        <button class="btn btn-block" type="button" id="logout2">${ic("logout")} Sair</button>
        <button class="btn btn-outline-danger btn-block" type="button" id="delAcc">${ic("trash")} Excluir minha conta</button>
      </div>
      ${isAdmin(u) ? `<div class="group">
        <h2 class="disp">Fase de testes</h2>
        <p class="muted" style="font-size:13.5px">Tudo fica salvo só neste aparelho. Restaurar volta às 3 contas de teste e às corridas iniciais.</p>
        <button class="btn btn-block" type="button" id="reset">${ic("refresh")} Restaurar dados iniciais</button>
      </div>` : ""}
      ${upgrade}
    </section>`;

  bindPhone($("#pf_tel")); bindCity($("#pf_cidade"));
  $("#darkSw").addEventListener("change", ev => setMode(ev.target.checked));
  const logout = () => { Session.clear(); SS.del("kohe.draft"); toast("Você saiu da conta."); go("/login"); };
  $("#logout").addEventListener("click", logout); $("#logout2").addEventListener("click", logout);
  const rs = $("#reset"); if (rs) rs.addEventListener("click", resetAll);

  $("#fotoIn").addEventListener("change", async ev => {
    const file = ev.target.files && ev.target.files[0]; if (!file) return;
    try {
      const foto = await compressImage(file, { max: 320, q: 0.8, square: true }), old = u.foto;
      u.foto = foto;
      if (!DB.save()) { u.foto = old; return; }
      render(); toast("Foto atualizada.");
    } catch (err) { toast("Não deu para ler essa imagem. Tente um JPG ou PNG.", true); }
  });
  const fotoRm = $("#fotoRm");
  if (fotoRm) fotoRm.addEventListener("click", () => { u.foto = null; DB.save(); render(); toast("Foto removida."); });

  const ask = $("#askUp");
  if (ask) ask.addEventListener("click", async () => {
    const ok = await confirmBox({ title: `Virar ${ROLE_LABEL[next]}?`, ok: "Enviar pedido", text: "O pedido vai para a administração do Kohe. Você continua usando o app normalmente enquanto espera." });
    if (!ok) return;
    DB.ups.push({ id: uid("up"), uid: u.id, de: u.role, para: next, status: "pendente", criado: new Date().toISOString() });
    DB.save(); render(); toast("Pedido de upgrade enviado.");
  });
  const cancel = $("#cancelUp");
  if (cancel) cancel.addEventListener("click", async () => {
    const ok = await confirmBox({ title: "Cancelar pedido?", ok: "Cancelar pedido", cancel: "Manter", danger: true, text: "Você pode pedir de novo quando quiser." });
    if (!ok) return;
    DB.ups = DB.ups.filter(x => x.id !== pend.id); DB.save(); render(); toast("Pedido cancelado.");
  });

  $("#pf").addEventListener("submit", ev => {
    ev.preventDefault();
    const d = {}; ["nome", "tel", "nasc", "rua", "num", "bairro", "cidade"].forEach(k => { d[k] = val("pf_" + k); });
    if (!d.nome || d.nome.length < 2) bad("pf_nome");
    if (!phoneOk(d.tel)) bad("pf_tel", "Informe o celular com DDD. Formato: +55 (19) 99876-5432");
    if (!d.nasc) bad("pf_nasc"); else if (ageOf(d.nasc) < MIN_IDADE) bad("pf_nasc", "É preciso ter 18 anos ou mais.");
    ["rua", "num", "bairro", "cidade"].forEach(k => { if (!d[k]) bad("pf_" + k); });
    if (goFirstBad(view)) return;
    const c = findCity(d.cidade);
    Object.assign(u, { nome: d.nome, tel: d.tel, nasc: d.nasc, end: { rua: d.rua, num: d.num, bairro: d.bairro, cidade: c ? c.n : d.cidade } });
    DB.save(); toast("Dados salvos.");
  });

  $("#pw_new").addEventListener("input", ev => { $("#pwRules").innerHTML = rulesHTML(ev.target.value); });
  $("#pwf").addEventListener("submit", async ev => {
    ev.preventDefault();
    const old = $("#pw_old").value, nw = $("#pw_new").value, nw2 = $("#pw_new2").value;
    if (!old) bad("pw_old");
    else if ((await hashPass(old, u.salt)) !== u.hash) bad("pw_old", "A senha atual não confere.");
    if (!nw) bad("pw_new"); else if (!passOk(nw)) bad("pw_new", "A nova senha ainda não cumpre todas as regras.");
    if (!nw2) bad("pw_new2"); else if (nw2 !== nw) bad("pw_new2", "As senhas não são iguais.");
    if (goFirstBad(view)) return;
    u.salt = uid("s"); u.hash = await hashPass(nw, u.salt);
    DB.save(); ["pw_old", "pw_new", "pw_new2"].forEach(id => { $("#" + id).value = ""; });
    $("#pwRules").innerHTML = rulesHTML(""); toast("Senha trocada.");
  });

  $("#delAcc").addEventListener("click", async () => {
    if (isAdmin(u) && DB.users.filter(x => x.role === "admin").length === 1) {
      toast("Você é o único administrador. Aprove outro admin antes de excluir a conta.", true); return;
    }
    const ok = await confirmBox({
      title: "Excluir conta?", danger: true, ok: "Excluir conta", typeToConfirm: u.nick,
      text: "Seu cadastro sai deste aparelho e não dá para desfazer. Pedidos pendentes são cancelados; corridas já publicadas continuam no feed."
    });
    if (!ok) return;
    DB.users = DB.users.filter(x => x.id !== u.id);
    DB.ups = DB.ups.filter(x => x.uid !== u.id);
    DB.races = DB.races.filter(r => !(r.autor === u.id && (r.status === "pendente" || r.status === "negada")));
    DB.save(); Session.clear(); SS.del("kohe.draft");
    go("/login"); toast("Conta excluída.");
  });
}, { tab: "perfil" });

/* =====================================================================
   INÍCIO
   ===================================================================== */
function installAppIcon() {
  const draw = size => {
    const c = document.createElement("canvas"); c.width = c.height = size;
    const x = c.getContext("2d"), s = size / 64;
    x.fillStyle = "#C4FF2E"; x.fillRect(0, 0, size, size);
    x.fillStyle = "#0D0F0B"; x.beginPath();
    [[19, 50], [26, 14], [34, 14], [30.6, 31.5], [45, 14], [55, 14], [37.5, 33], [47, 50], [37.5, 50], [31.3, 37.5], [28.8, 40], [27, 50]]
      .forEach(([px, py], i) => i ? x.lineTo(px * s, py * s) : x.moveTo(px * s, py * s));
    x.closePath(); x.fill();
    return c.toDataURL("image/png");
  };
  try {
    const i180 = draw(180), i512 = draw(512), start = location.href.split("#")[0];
    const touch = document.createElement("link"); touch.rel = "apple-touch-icon"; touch.href = i180; document.head.appendChild(touch);
    const manifest = {
      name: "Kohe", short_name: "Kohe", start_url: start, scope: start.replace(/[^/]*$/, ""),
      display: "standalone", orientation: "portrait", background_color: "#090A08", theme_color: "#090A08",
      icons: [{ src: i512, sizes: "512x512", type: "image/png", purpose: "any" }, { src: i180, sizes: "180x180", type: "image/png" }]
    };
    const m = document.createElement("link"); m.rel = "manifest";
    m.href = "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(m);
  } catch (e) {}
}

function maybeInstallTip() {
  let show = false;
  try {
    const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
    show = !Prefs.d.dicaTela && !standalone && window.self === window.top && matchMedia("(pointer: coarse)").matches;
  } catch (e) { show = false; }
  if (!show) return;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  setTimeout(() => {
    if ($(".scrim")) return;
    const sh = openSheet(`
      <div class="sheet-head"><h2 class="disp">Abra como app</h2><button class="icon-btn" type="button" data-close aria-label="Fechar">${ic("x")}</button></div>
      <p class="lead">Coloque o Kohe na tela inicial para abrir em tela cheia, sem a barra do navegador. Não precisa instalar nada da loja.</p>
      <ol class="steps">${ios
        ? `<li>Toque em <b>Compartilhar</b> ${ic("share")} na barra do Safari.</li><li>Escolha <b>Adicionar à Tela de Início</b>.</li>`
        : `<li>Toque no menu ${ic("dots")} do navegador.</li><li>Escolha <b>Adicionar à tela inicial</b>.</li>`}<li>Abra o Kohe pelo ícone verde.</li></ol>
      <button class="btn btn-volt btn-block" type="button" data-close>Entendi</button>`);
    sh.el.addEventListener("click", ev => { if (ev.target.closest("[data-close]")) { Prefs.d.dicaTela = true; Prefs.save(); } });
  }, 1200);
}

(async function boot() {
  Prefs.load(); applyTheme();
  if (!DB.load()) await seedDB();
  purgeExcluded();
  $("#fab").addEventListener("click", () => { SS.del("kohe.draft"); go("/nova"); });
  window.addEventListener("storage", ev => {
    if (ev.key === DB_KEY) { DB.load(); if (!$(".scrim")) render(); }
    else if (ev.key === "kohe.prefs") { Prefs.load(); applyTheme(); }
  });
  render();
  installAppIcon();
  maybeInstallTip();
})();
</script>
