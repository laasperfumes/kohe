async function askDeletion(r, u) {
  const motivo = await confirmBox({
    title: "Pedir exclusão", ok: "Enviar pedido", danger: true,
    text: `A administração decide se <b>${esc(r.nome)}</b> sai do Kohe. Até lá, nada muda para quem vê a corrida.`,
    reason: { label: "Por que excluir?", min: MIN_JUST, placeholder: "Ex.: a organização cancelou a prova." }
  });
  if (!motivo) return;
  const t = new Date().toISOString();
  r.pedidoExclusao = { t, por: u.id, motivo, status: "pendente" };
  r.hist.push({ t, acao: "exclusao-pedida", por: u.id, obs: motivo });
  DB.save(); render(); toast("Pedido de exclusão enviado para a administração.");
}
const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;

function myReqCard(r, admin) {
  const st = raceState(r), left = MAX_ENVIOS - r.envios, pe = r.pedidoExclusao;
  const sent = lastEvent(r, "enviada", "reenviada", "publicada");
  let foot = "";
  if (st === "pendente") foot = `${r.envios}º envio · ${sent ? fmtStamp(sent.t) : ""}`;
  else if (st === "publicada") foot = `No feed · largada ${relDay(r.data)}`;
  else if (st === "finalizada") foot = "Saiu do feed: a data já passou";
  else if (st === "negada") foot = left > 0 ? `${plural(left, "reenvio restante", "reenvios restantes")}` : "Limite de reenvios atingido";
  else if (st === "excluida") foot = `Excluída · some em ${plural(diasRestantes(r), "dia", "dias")}`;
  const delWaiting = pe && pe.status === "pendente" && st !== "excluida";
  const canAskDel = !admin && (st === "publicada" || st === "pendente") && !delWaiting;
  return `<article class="req">
    <div class="req-top"><div class="form" style="gap:5px;min-width:0"><span class="meta">${fmtShort(r.data)} · ${r.hora || "hora a confirmar"} · ${esc(r.cidade)}</span><h3>${esc(r.nome)}</h3></div>${stPill(st)}</div>
    ${st === "negada" && r.motivo ? `<div class="reason"><b>Motivo da negativa</b>${esc(r.motivo)}</div>` : ""}
    ${delWaiting ? `<div class="reason warn"><b>Exclusão solicitada · aguardando</b>${esc(pe.motivo)}</div>` : ""}
    ${pe && pe.status === "negado" && st !== "excluida" ? `<p class="eyebrow">Pedido de exclusão recusado em ${fmtStamp(pe.decidido)}</p>` : ""}
    ${st === "excluida" && r.exclusao.motivo ? `<div class="reason"><b>Motivo da exclusão</b>${esc(r.exclusao.motivo)}</div>` : ""}
    <div class="req-top" style="align-items:center">
      <span class="eyebrow">${foot}</span>
      <div class="btn-row" style="flex:none">
        <a class="btn btn-sm" href="#/corrida/${r.id}?de=sol">Ver</a>
        ${st === "negada" && left > 0 ? `<a class="btn btn-sm btn-volt" href="#/nova?editar=${r.id}">${ic("edit")} Editar e reenviar</a>` : ""}
      </div>
    </div>
    ${canAskDel ? `<button class="linkbtn" type="button" data-askdel="${r.id}" style="align-self:flex-start;font-size:13px;color:var(--danger)">${ic("trash")} Pedir exclusão desta corrida</button>` : ""}
  </article>`;
}

function excludedCard(r) {
  const by = userById(r.exclusao.por), pe = r.pedidoExclusao, asker = pe && userById(pe.por);

function favRacesOf(u) {

    <section class="page">

        <div class="who">
          <h1 class="disp">@${esc(u.nick)}</h1>
          ${roleChipsHTML(u, konChip)}
          ${klanLineHTML(u, "perfil")}
          ${u.foto ? `<button class="linkbtn" type="button" id="fotoRm" style="font-size:13px;min-height:32px;align-self:flex-start">Remover foto</button>` : ""}
        </div>
      </div>
      <nav class="quick" aria-label="Seu conteúdo">
        <a class="qtile" href="#/perfil/favoritas">${ic("heart")}<b>Favoritos</b><span class="ct num">${nFav} ${nFav === 1 ? "corrida" : "corridas"}</span></a>
        <a class="qtile" href="#/mensagens">${ic("chat")}<b>Mensagens</b><span class="ct">${nMsgs ? `${nMsgs} nova${nMsgs === 1 ? "" : "s"}` : "Suas conversas"}</span>${nMsgs ? `<span class="badge-num">${nMsgs}</span>` : ""}</a>

      </nav>
      <div class="group slim">
        <div class="setting sm">
          <span class="txt"><b>Modo noturno</b></span>
          <label class="switch sm"><input type="checkbox" role="switch" id="darkSw"${isDark() ? " checked" : ""} aria-label="Modo noturno"><i></i></label>
        </div>
        <div class="setting sm" style="border-top:1px solid var(--line)">
          <span class="txt"><b>Perfil privado</b></span>
          <label class="switch sm"><input type="checkbox" role="switch" id="privSw"${u.privado ? " checked" : ""} aria-label="Perfil privado"><i></i></label>
        </div>
      </div>
      <div class="group">
        <h2 class="disp">Seus dados</h2>

          <div class="field"><label for="pfEmail">E-mail</label><input id="pfEmail" class="input" value="${esc(u.email)}" readonly><span class="lock">${ic("lock")} Não é possível alterar</span></div>
          ${F({ id: "pf_nome", label: "Nome", value: u.nome, attrs: 'autocomplete="name"', err: "Informe seu nome." })}
          ${F({ id: "pf_tel", label: "Celular com DDD", type: "tel", value: u.tel, attrs: 'autocomplete="tel" inputmode="tel"', err: "Informe o celular com DDD." })}

          <div class="row-num">${F({ id: "pf_rua", label: "Rua", value: e.rua, err: "Informe a rua." })}${F({ id: "pf_num", label: "Número", value: e.num, attrs: 'inputmode="numeric"', err: "Informe o nº." })}</div>

          ${F({ id: "pf_cidade", label: "Cidade", value: e.cidade, wrap: "city", err: "Informe a cidade." })}
          <button class="btn btn-volt btn-block" type="submit">Salvar alterações</button>
        </form>
      </div>
      <div class="group">
        <h2 class="disp">Senha</h2>

          <button class="linkbtn forgot" type="button" id="pwForgot">Esqueci minha senha</button>
          ${F({ id: "pw_new", label: "Nova senha", type: "password", wrap: "eye", attrs: 'autocomplete="new-password"', err: "Crie a nova senha." })}

        </form>
      </div>
      <div class="group danger-zone">
        <h2 class="disp">Conta</h2>
        <button class="btn btn-block" type="button" id="logout2">${ic("logout")} Sair</button>
        <button class="btn btn-outline-danger btn-block" type="button" id="delAcc">${ic("trash")} Excluir minha conta</button>
      </div>
      ${isAdmin(u) ? `<div class="group">
        <h2 class="disp">Fase de testes</h2>

        <button class="btn btn-block" type="button" id="reset">${ic("refresh")} Restaurar dados iniciais</button>
      </div>` : ""}
      ${upgrade}
      <a class="linkbtn small-link" href="#/klan/novo">${ic("plus")} Criar Klan</a>
      ${isAdmin(u) ? `<button class="linkbtn small-link" type="button" id="finderToggle" style="margin-top:-14px">${ic("fire")} Finder ${DB.config.finder ? "ativado · desativar" : "desativado · ativar"}</button>` : ""}

  bindPhone($("#pf_tel")); bindCity($("#pf_cidade"));
  $("#darkSw").addEventListener("change", ev => setMode(ev.target.checked));
  $("#privSw").addEventListener("change", ev => {
    u.privado = ev.target.checked; DB.save();
    toast(u.privado ? "Perfil privado: só suas Konexões veem suas favoritas e Konexões." : "Perfil público: todo mundo vê suas favoritas e Konexões.");
  });
  const logout = () => { Session.clear(); SS.del("kohe.draft"); toast("Você saiu da conta."); go("/login"); };
  $("#logout").addEventListener("click", logout); $("#logout2").addEventListener("click", logout);
  const rs = $("#reset"); if (rs) rs.addEventListener("click", resetAll);
  $("#pwForgot").addEventListener("click", () => { RECOVERY = { uid: u.id, step: "enviar", from: "perfil" }; go("/recuperar"); });
  const ft = $("#finderToggle");
  if (ft) ft.addEventListener("click", async () => {
    if (!isAdmin(u)) return;
    const on = !DB.config.finder;
    const ok = await confirmBox({
      title: on ? "Ativar o Finder?" : "Desativar o Finder?", ok: on ? "Ativar" : "Desativar", danger: !on,
      text: on ? "Todos os perfis deste aparelho passam a deslizar corridas na aba Finder." : "A aba Finder volta a mostrar “Novidades em breve” para todos os perfis."
    });
    if (!ok) return;
    DB.config.finder = on; DB.save(); render(); toast(on ? "Finder ativado para todos." : "Finder desativado para todos.");
  });

  $("#fotoIn").addEventListener("change", async ev => {
    const file = ev.target.files && ev.target.files[0]; if (!file) return;
    try {
      const foto = await compressImage(file, { max: 320, q: 0.8, square: true }), old = u.foto;
      u.foto = foto;
      if (!DB.save()) { u.foto = old; return; }
      render(); toast("Foto atualizada.");
    } catch (err) { toast("Não deu para ler essa imagem. Tente um JPG ou PNG.", true); }
  });
  const fotoRm = $("#fotoRm");
  if (fotoRm) fotoRm.addEventListener("click", () => { u.foto = null; DB.save(); render(); toast("Foto removida."); });

  const ask = $("#askUp");
  if (ask) ask.addEventListener("click", async () => {
    const ok = await confirmBox({ title: `Virar ${ROLE_LABEL[next]}?`, ok: "Enviar pedido", text: "O pedido vai para a administração do Kohe. Você continua usando o app normalmente enquanto espera." });
    if (!ok) return;
    DB.ups.push({ id: uid("up"), uid: u.id, de: u.role, para: next, status: "pendente", criado: new Date().toISOString() });
    DB.save(); render(); toast("Pedido de upgrade enviado.");
  });
  const cancel = $("#cancelUp");
  if (cancel) cancel.addEventListener("click", async () => {
    const ok = await confirmBox({ title: "Cancelar pedido?", ok: "Cancelar pedido", cancel: "Manter", danger: true, text: "Você pode pedir de novo quando quiser." });
    if (!ok) return;
    DB.ups = DB.ups.filter(x => x.id !== pend.id); DB.save(); render(); toast("Pedido cancelado.");
  });

  $("#pf").addEventListener("submit", ev => {
    ev.preventDefault();
    const d = {}; ["nome", "tel", "nasc", "rua", "num", "bairro", "cidade"].forEach(k => { d[k] = val("pf_" + k); });
    if (!d.nome || d.nome.length < 2) bad("pf_nome");
    if (!phoneOk(d.tel)) bad("pf_tel", "Informe o celular com DDD. Formato: +55 (19) 99876-5432");
    if (!d.nasc) bad("pf_nasc"); else if (ageOf(d.nasc) < MIN_IDADE) bad("pf_nasc", "É preciso ter 18 anos ou mais.");
    ["rua", "num", "bairro", "cidade"].forEach(k => { if (!d[k]) bad("pf_" + k); });
    if (goFirstBad(view)) return;
    const c = findCity(d.cidade);
    Object.assign(u, { nome: d.nome, tel: d.tel, nasc: d.nasc, end: { rua: d.rua, num: d.num, bairro: d.bairro, cidade: c ? c.n : d.cidade } });
    DB.save(); toast("Dados salvos.");
  });

  $("#pw_new").addEventListener("input", ev => { $("#pwRules").innerHTML = rulesHTML(ev.target.value); });
  $("#pwf").addEventListener("submit", async ev => {
    ev.preventDefault();
    const old = $("#pw_old").value, nw = $("#pw_new").value, nw2 = $("#pw_new2").value;
    if (!old) bad("pw_old");
    else if ((await hashPass(old, u.salt)) !== u.hash) bad("pw_old", "A senha atual não confere. Se esqueceu, use “Esqueci minha senha”.");
    if (!nw) bad("pw_new"); else if (!passOk(nw)) bad("pw_new", "A nova senha ainda não cumpre todas as regras.");
    if (!nw2) bad("pw_new2"); else if (nw2 !== nw) bad("pw_new2", "As senhas não são iguais.");
    if (goFirstBad(view)) return;
    u.salt = uid("s"); u.hash = await hashPass(nw, u.salt);
    DB.save(); ["pw_old", "pw_new", "pw_new2"].forEach(id => { $("#" + id).value = ""; });
    $("#pwRules").innerHTML = rulesHTML(""); toast("Senha trocada.");
  });

  $("#delAcc").addEventListener("click", async () => {
    if (isAdmin(u) && DB.users.filter(x => x.role === "admin").length === 1) {
      toast("Você é o único administrador. Aprove outro admin antes de excluir a conta.", true); return;
    }
    const ok = await confirmBox({
      title: "Excluir conta?", danger: true, ok: "Excluir conta", typeToConfirm: u.nick,
      text: "Seu cadastro sai deste aparelho e não dá para desfazer. Pedidos pendentes e Konexões são apagados; corridas já publicadas continuam no feed."
    });
    if (!ok) return;
    DB.users = DB.users.filter(x => x.id !== u.id);
    DB.ups = DB.ups.filter(x => x.uid !== u.id);
    DB.races = DB.races.filter(r => !(r.autor === u.id && (r.status === "pendente" || r.status === "negada")));
    DB.conns = DB.conns.filter(c => c.de !== u.id && c.para !== u.id);
    DB.notifs = DB.notifs.filter(n => n.para !== u.id && n.de !== u.id);
    DB.msgs = DB.msgs.filter(m => m.de !== u.id && m.para !== u.id);
    DB.klans.forEach(k => { if (k.dono === u.id) k.dono = null; });
    DB.save(); Session.clear(); SS.del("kohe.draft");
    go("/login"); toast("Conta excluída.");
  });
}, { tab: "perfil" });

route(/^\/perfil\/favoritas$/, function vFavs(view, _, q, u) {
  const list = favRacesOf(u);
  view.innerHTML = `${subHead("Favoritos", "#/perfil", "Perfil")}
    <section class="page">
      ${list.length ? list.map(r => raceCard(r, u, null, { date: true, from: "fav" })).join("")
        : `<div class="empty"><h3>Nenhum favorito</h3><p>Toque no ${ic("heart")} de uma corrida para guardar aqui.</p><a class="btn btn-sm btn-volt" href="#/feed">Ver corridas</a></div>`}
    </section>`;
}, { tab: "perfil" });

route(/^\/perfil\/konexoes$/, function vKonexoes(view, _, q, u) {
  const list = konexoesOf(u.id).sort((a, b) => a.nick.localeCompare(b.nick));
  const sent = DB.conns.filter(c => c.status === "pendente" && c.de === u.id).map(c => userById(c.para)).filter(Boolean);
  const href = p => "#/u/" + encodeURIComponent(p.nick) + "?de=konexoes";
  view.innerHTML = `${subHead("Konexões", "#/perfil", "Perfil")}
    <section class="page">
      ${list.length ? `<div class="rows">${list.map(p => personRow(p, href(p))).join("")}</div>`
        : `<div class="empty"><h3>Nenhuma konexão</h3><p>Busque pessoas pelo nickname e toque em Konectar.</p><a class="btn btn-sm btn-volt" href="#/buscar">${ic("search")} Buscar pessoas</a></div>`}
      ${sent.length ? `<div class="section-title"><h2 class="disp">Pedidos enviados</h2><span class="eyebrow num">${sent.length}</span></div><div class="rows">${sent.map(p => personRow(p, href(p))).join("")}</div>` : ""}
    </section>`;
}, { tab: "perfil" });

route(/^\/perfil\/notificacoes$/, function vNotifs(view, _, q, u) {
  const reqs = DB.conns.filter(c => c.status === "pendente" && c.para === u.id).sort((a, b) => b.t.localeCompare(a.t));
  const acts = DB.notifs.filter(n => n.para === u.id).sort((a, b) => b.t.localeCompare(a.t)).slice(0, 30);
  const unreadIds = new Set(acts.filter(n => !n.lida).map(n => n.id));
  view.innerHTML = `${subHead("Notificações", "#/perfil", "Perfil")}
    <section class="page">
      <div class="section-title"><h2 class="disp">Pedidos de konexão</h2><span class="eyebrow num">${reqs.length}</span></div>
      ${reqs.length ? `<div class="rows">${reqs.map(c => {
        const p = userById(c.de); if (!p) return "";
        return `<div class="person-row">${avatarHTML(p, "avatar av-sm")}<a class="who" href="#/u/${encodeURIComponent(p.nick)}?de=notif" style="color:inherit;text-decoration:none"><b>@${esc(p.nick)}</b><span>${esc(p.nome)} · ${fmtStamp(c.t)}</span></a><button class="btn btn-sm" type="button" data-deny="${c.id}" aria-label="Recusar pedido de @${esc(p.nick)}">${ic("x")}</button><button class="btn btn-sm btn-volt" type="button" data-accept="${c.id}">Aceitar</button></div>`;
      }).join("")}</div>` : `<div class="empty sm"><p>Nenhum pedido esperando você.</p></div>`}
      <div class="section-title"><h2 class="disp">Atividade</h2></div>
      ${acts.length ? `<div class="rows">${acts.map(n => {
        const p = userById(n.de);
        return `<a class="person-row" href="${p ? "#/u/" + encodeURIComponent(p.nick) + "?de=notif" : "#/perfil/notificacoes"}">${avatarHTML(p, "avatar av-sm")}<span class="who"><b>@${esc(p ? p.nick : "conta excluída")} aceitou sua konexão</b><span>${fmtStamp(n.t)}</span></span>${unreadIds.has(n.id) ? '<span class="badge-dot" aria-label="Nova"></span>' : ""}</a>`;
      }).join("")}</div>` : `<div class="empty sm"><p>Quando alguém aceitar seu pedido de konexão, aparece aqui.</p></div>`}
    </section>`;
  $$("[data-accept]", view).forEach(b => b.addEventListener("click", () => {
    const c = DB.conns.find(x => x.id === b.dataset.accept); if (!c) return;
    const p = userById(c.de); acceptConn(c, u); render(); toast(`Konectado com @${p ? p.nick : ""}.`);
  }));
  $$("[data-deny]", view).forEach(b => b.addEventListener("click", () => {
    const c = DB.conns.find(x => x.id === b.dataset.deny); if (!c) return;
    removeConn(c); render(); toast("Pedido recusado.");
  }));
  if (unreadIds.size) { DB.notifs.forEach(n => { if (unreadIds.has(n.id)) n.lida = true; }); DB.save(); renderChrome({ tab: "perfil" }, u); }
}, { tab: "perfil" });

function roleChipsHTML(u, extra = "") {
  return `<span class="chips-row"><span class="role ${u.role}">${ic(ROLE_ICON[u.role] || "user")}${ROLE_LABEL[u.role]}</span>${u.modKlans && u.role !== "moderador" ? `<span class="role">${ic("users")}Moderador</span>` : ""}${u.premium ? `<span class="role premium">${ic("bolt")}Premium</span>` : ""}${extra}</span>`;
}
// toda konexão precisa de aprovação, com perfil público ou privado
function askKonexao(u, p) {
  if (!p || p.id === u.id || connBetween(u.id, p.id)) return false;
  DB.conns.push({ id: uid("c"), de: u.id, para: p.id, status: "pendente", t: new Date().toISOString() });
  DB.save(); toast(`Pedido enviado. @${p.nick} precisa aprovar.`);
  return true;
}

route(/^\/u\/([^/]+)$/, function vUser(view, [nickEnc], q, u) {
  const p = DB.users.find(x => x.nick === decodeURIComponent(nickEnc).toLowerCase());
  if (!p) { view.innerHTML = notFoundHTML("Perfil não encontrado", "Essa conta pode ter sido excluída.", "#/buscar", "Voltar à busca"); return; }
  if (p.id === u.id) return redirect("/perfil");
  const from = q.get("de") || "";
  const BACKS = { konexoes: ["#/perfil/konexoes", "perfil"], notif: ["#/perfil/notificacoes", "perfil"], busca: ["#/buscar", "buscar"], mensagens: ["#/mensagens", "perfil"] };
  let back = "#/buscar", tab = "buscar";
  if (BACKS[from]) [back, tab] = BACKS[from];
  else if (from.startsWith("klan:")) back = "#/klan/" + encodeURIComponent(from.slice(5));
  else if (from.startsWith("koh:")) { back = "#/kohedores/" + encodeURIComponent(from.slice(4)); tab = "finder"; }
  if (tab !== "buscar") renderChrome({ tab }, u);
  const c = connBetween(u.id, p.id), see = canSeeProfile(u, p);
  let action;
  if (c && c.status === "ativa") action = `<a class="btn btn-volt btn-block" href="#/chat/${encodeURIComponent(p.nick)}?de=u">${ic("chat")} Mandar mensagem</a><div class="state-ok">${ic("check")} Vocês estão konectados</div><button class="linkbtn" type="button" id="kUndo" style="align-self:center;font-size:13px;color:var(--danger)">Desfazer konexão</button>`;
  else if (c && c.de === u.id) action = `<div class="state-ok" style="border-color:var(--line-2);color:var(--ink-2)">${ic("clock")} Pedido enviado. @${esc(p.nick)} precisa aprovar</div><button class="linkbtn" type="button" id="kCancel" style="align-self:center;font-size:13px">Cancelar pedido</button>`;
  else if (c) action = `<p class="muted" style="text-align:center">@${esc(p.nick)} quer se konectar com você.</p><div class="btn-row"><button class="btn" type="button" id="kDeny">Recusar</button><button class="btn btn-volt" type="button" id="kAccept">${ic("check")} Aceitar</button></div>`;
  else action = `<button class="btn btn-volt btn-block" type="button" id="kGo">${ic("link")} Konectar</button><p class="eyebrow" style="text-align:center">@${esc(p.nick)} precisa aprovar o pedido</p>`;
  const kons = see ? konexoesOf(p.id).sort((a, b) => a.nick.localeCompare(b.nick)) : [];
  const favs = see ? favRacesOf(p) : [];
  view.innerHTML = `
    <header class="topbar"><div class="topbar-in"><a class="icon-btn" href="${back}" aria-label="Voltar">${ic("back")}</a><div class="t"><span class="eyebrow">Perfil</span></div></div></header>
    <section class="page">
      <div class="profile-head">
        ${avatarHTML(p)}
        <h1 class="disp">@${esc(p.nick)}</h1>
        <span class="nome">${esc(p.nome)}</span>
        ${klanLineHTML(p, "u:" + p.nick)}
      </div>
      ${action}
      ${see ? `
        <div class="section-title"><h2 class="disp">Konexões</h2><span class="eyebrow num">${kons.length}</span></div>
        ${kons.length ? `<div class="rows">${kons.map(x => personRow(x, x.id === u.id ? "#/perfil" : "#/u/" + encodeURIComponent(x.nick) + "?de=busca")).join("")}</div>` : `<div class="empty sm"><p>@${esc(p.nick)} ainda não tem Konexões.</p></div>`}
        <div class="section-title"><h2 class="disp">Favoritos</h2><span class="eyebrow num">${favs.length}</span></div>
        ${favs.length ? favs.map(r => raceCard(r, u, null, { date: true, from: "u:" + p.nick })).join("") : `<div class="empty sm"><p>Nenhuma corrida favoritada.</p></div>`}`
      : `<div class="lock-card">${ic("lock")}<span>Perfil privado. Só as Konexões de @${esc(p.nick)} veem as corridas favoritas e as Konexões.</span></div>`}
    </section>`;
  const on = (id, fn) => { const b = document.getElementById(id); if (b) b.addEventListener("click", fn); };

function searchAll(term, u) {
  const k = norm(String(term).replace(/^@/, "")); if (!k) return { people: [], klans: [] };
  const score = (main, extra) => main.startsWith(k) ? 0 : main.includes(k) ? 1 : extra.includes(k) ? 2 : -1;
  const people = DB.users.filter(x => x.id !== u.id).map(x => ({ x, s: score(norm(x.nick), norm(x.nome)) }))
    .filter(o => o.s >= 0).sort((a, b) => a.s - b.s || a.x.nick.localeCompare(b.x.nick)).slice(0, 20).map(o => o.x);
  const klans = DB.klans.map(x => ({ x, s: score(norm(x.sigla || ""), norm(x.nome)) }))
    .filter(o => o.s >= 0).sort((a, b) => a.s - b.s || a.x.nome.localeCompare(b.x.nome)).slice(0, 10).map(o => o.x);
  return { people, klans };
}
function logSearch(u, tipo, v) {

  DB.save();
}

const reducedMotion = () => !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

function emberBurst(host) {
  if (reducedMotion()) return;
  host.classList.remove("puff"); void host.offsetWidth; host.classList.add("puff");
  for (let i = 0; i < 10; i++) {
    const s = document.createElement("span");
    s.className = "ember"; s.innerHTML = ic("fire");
    s.style.setProperty("--x", Math.round(Math.random() * 140 - 70) + "px");
    s.style.setProperty("--h", Math.round(110 + Math.random() * 90) + "px");
    s.style.setProperty("--s", (0.45 + Math.random() * 0.6).toFixed(2));
    s.style.setProperty("--d", (Math.random() * 0.2).toFixed(2) + "s");
    s.addEventListener("animationend", () => s.remove());
    setTimeout(() => s.remove(), 1600);
    host.appendChild(s);
  }
}

function finderState(u) {

route(/^\/finder$/, function vFinder(view, _, q, u) {

  const queue = publishedUpcoming().filter(r => !st.vistas.includes(r.id) && !isFav(u, r.id));
  const left = Math.max(0, SLIDES_GRATIS - st.usados);
  const r = queue[0], nextR = queue[1];
  const passadas = st.vistas.filter(id => { const x = DB.races.find(y => y.id === id); return x && x.status === "publicada" && !isOver(x) && !isFav(u, id); }).length;
  view.innerHTML = `
    <section class="finder">
      <div class="finder-top">
        ${premium
          ? `<span class="role premium">${ic("bolt")}Premium · slides ilimitados</span>`
          : `<div class="slidebar" role="progressbar" aria-label="Slides grátis de hoje" aria-valuemin="0" aria-valuemax="${SLIDES_GRATIS}" aria-valuenow="${left}"><i style="width:${(left / SLIDES_GRATIS) * 100}%"></i></div><span class="eyebrow num">${left}/${SLIDES_GRATIS}</span>`}
      </div>
      ${r ? `
        <div class="deck">
          ${nextR ? `<article class="fcard back${entering ? " enter" : ""}" aria-hidden="true">${finderCardInner(nextR)}</article>` : ""}
          <article class="fcard" id="fcard" aria-label="${esc(r.nome)}. Arraste para a direita para favoritar ou para a esquerda para jogar na lixeira.">${finderCardInner(r)}<span class="stamp like">${ic("heart")}Favoritar</span><span class="stamp nope">${ic("trash")}Lixeira</span></article>
        </div>
        <div class="fbtns">
          <button class="fbtn nope" type="button" id="fNope" aria-label="Jogar na lixeira">${ic("trash")}</button>
          <button class="fbtn like" type="button" id="fLike" aria-label="Favoritar corrida">${ic("heart")}</button>
        </div>`
      : `<div class="empty"><h3>Você viu tudo</h3><p>Não tem corrida nova para deslizar agora.</p>${passadas ? `<button class="btn btn-sm btn-volt" type="button" id="fRedo">Rever as ${passadas} que passei</button>` : `<a class="btn btn-sm" href="#/perfil/favoritas">Ver favoritas</a>`}</div>`}
      <div class="fav-toast" id="favToast" hidden></div>
    </section>`;
  const redo = $("#fRedo");
  if (redo) redo.addEventListener("click", () => { st.vistas = []; DB.save(); render(); });
  const card = $("#fcard");
  if (!card) return;
  let x0 = 0, y0 = 0, dx = 0, dy = 0, down = false, moved = false, busy = false;
  const back = $(".fcard.back", view);
  const setT = (x, y, anim) => {
    card.style.transition = anim ? "transform .3s cubic-bezier(.2,.8,.2,1)" : "none";
    card.style.transform = x || y ? `translate(${x}px, ${y}px) rotate(${x / 16}deg)` : "";
    card.style.setProperty("--like", Math.max(0, Math.min(1, x / 90)).toFixed(2));
    card.style.setProperty("--nope", Math.max(0, Math.min(1, -x / 90)).toFixed(2));
    if (back) {   // a próxima corrida vem chegando conforme o card sai
      const k = Math.max(0, Math.min(1, Math.abs(x) / (card.offsetWidth * 0.6 || 1)));
      back.classList.remove("enter");
      back.style.transition = anim ? "transform .3s cubic-bezier(.2,.8,.2,1), opacity .3s ease" : "none";
      back.style.transform = `translateY(${(14 * (1 - k)).toFixed(1)}px) scale(${(0.95 + 0.05 * k).toFixed(3)})`;
      back.style.opacity = (0.6 + 0.4 * k).toFixed(2);
    }
  };
  const decide = dir => {
    if (busy) return;
    card.classList.remove("hinting");
    if (!premium && finderState(u).usados >= SLIDES_GRATIS) { setT(0, 0, true); slidesOverPopup(); return; }
    busy = true;
    const s = finderState(u);
    if (!premium) s.usados++;
    s.vistas = [...new Set([...s.vistas, r.id])];
    if (dir > 0 && !isFav(u, r.id)) u.favs = [...favsOf(u), r.id];
    DB.save();
    const done = () => { FINDER_ENTER = true; render(); if (dir > 0) favToast(r); };
    if (document.hidden || reducedMotion()) return done();
    setT(dir * (card.getBoundingClientRect().width + 160), dy, true);
    let fired = false;
    const fin = () => { if (!fired) { fired = true; done(); } };
    card.addEventListener("transitionend", fin, { once: true });
    setTimeout(fin, 450);
  };
  card.addEventListener("pointerdown", e => {
    if (busy || (e.pointerType === "mouse" && e.button !== 0)) return;
    card.classList.remove("hinting");
    down = true; moved = false; x0 = e.clientX; y0 = e.clientY; dx = dy = 0;
    try { card.setPointerCapture(e.pointerId); } catch (err) {}
  });
  card.addEventListener("pointermove", e => {
    if (!down) return;
    dx = e.clientX - x0; dy = (e.clientY - y0) * 0.25;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
    setT(dx, dy, false);
  });
  card.addEventListener("pointerup", () => {
    if (!down) return; down = false;
    if (!moved) { setT(0, 0, false); go("/corrida/" + r.id + "?de=finder"); return; }
    if (Math.abs(dx) > card.getBoundingClientRect().width * 0.28) decide(dx > 0 ? 1 : -1);
    else setT(0, 0, true);
  });
  card.addEventListener("pointercancel", () => { down = false; setT(0, 0, true); });
  $("#fLike").addEventListener("click", () => decide(1));
  $("#fNope").addEventListener("click", () => decide(-1));
  if (!st.hint) {   // primeira vez: mostra o gesto sem executar nada
    st.hint = true; DB.save();
    if (!reducedMotion()) card.classList.add("hinting");
  }
}, { tab: "finder" });

function validDesde(s) {
  const y = new Date().getFullYear();
  let m = s.match(/^(\d{4})$/);
  if (m) return +m[1] >= 1900 && +m[1] <= y;
  m = s.match(/^(\d{2})\/(\d{4})$/);
  if (m) return +m[1] >= 1 && +m[1] <= 12 && +m[2] >= 1900 && +m[2] <= y;
  m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (m) { const dt = new Date(+m[3], +m[2] - 1, +m[1]); return dt.getDate() === +m[1] && dt.getMonth() === +m[2] - 1 && +m[3] >= 1900 && dt <= new Date(); }
  return false;
}

const pairMsgs = (a, b) => DB.msgs.filter(m => (m.de === a && m.para === b) || (m.de === b && m.para === a)).sort((x, y) => x.t.localeCompare(y.t));
function shortStamp(iso) { const d = new Date(iso); return ymd(d) === ymd(new Date()) ? `${pad2(d.getHours())}:${pad2(d.getMinutes())}` : `${d.getDate()} ${MON[d.getMonth()]}`; }

route(/^\/mensagens$/, function vInbox(view, _, q, u) {
  const ids = new Set(konexoesOf(u.id).map(p => p.id));
  DB.msgs.forEach(m => { if (m.de === u.id) ids.add(m.para); else if (m.para === u.id) ids.add(m.de); });
  const rows = [...ids].map(id => userById(id)).filter(Boolean).map(p => {
    const ms = pairMsgs(u.id, p.id);
    return { p, last: ms[ms.length - 1], unread: ms.filter(m => m.para === u.id && !m.lida).length };
  }).sort((a, b) => (b.last ? b.last.t : "").localeCompare(a.last ? a.last.t : "") || a.p.nick.localeCompare(b.p.nick));
  view.innerHTML = `${subHead("Mensagens", "#/perfil", "Perfil")}
    <section class="page">
      ${rows.length ? `<div class="rows">${rows.map(({ p, last, unread }) => `<a class="person-row" href="#/chat/${encodeURIComponent(p.nick)}">${avatarHTML(p, "avatar av-sm")}<span class="who"><b>@${esc(p.nick)}</b><span>${last ? (last.de === u.id ? "Você: " : "") + esc(last.texto) : "Mande o primeiro oi"}</span></span>${unread ? `<span class="badge-num">${unread}</span>` : last ? `<span class="eyebrow">${shortStamp(last.t)}</span>` : ""}</a>`).join("")}</div>`
        : `<div class="empty"><h3>Nenhuma conversa</h3><p>Konecte-se com alguém para trocar mensagens. No Finder, veja quem favoritou as mesmas corridas.</p><a class="btn btn-sm btn-volt" href="#/buscar">${ic("search")} Buscar pessoas</a></div>`}
    </section>`;
}, { tab: "perfil" });

route(/^\/chat\/([^/]+)$/, function vChat(view, [nickEnc], q, u) {
  const p = DB.users.find(x => x.nick === decodeURIComponent(nickEnc).toLowerCase());
  if (!p || p.id === u.id) return redirect("/mensagens");
  const from = q.get("de") || "";
  const back = from === "u" ? "#/u/" + encodeURIComponent(p.nick) : from.startsWith("koh:") ? "#/kohedores/" + from.slice(4) : "#/mensagens";
  const connected = isConnected(u.id, p.id), ms = pairMsgs(u.id, p.id), key = "kohe.chat." + p.id;
  let lastDay = "", log = "";
  ms.forEach(m => {
    const d = new Date(m.t), day = ymd(d);
    if (day !== lastDay) { lastDay = day; log += `<div class="chat-day">${day === ymd(new Date()) ? "Hoje" : fmtShort(day)}</div>`; }
    log += `<div class="bubble ${m.de === u.id ? "me" : "them"}"><p>${esc(m.texto)}</p><time>${pad2(d.getHours())}:${pad2(d.getMinutes())}</time></div>`;
  });
  view.innerHTML = `
    <header class="topbar"><div class="topbar-in">
      <a class="icon-btn" href="${back}" aria-label="Voltar">${ic("back")}</a>
      <a class="chat-who" href="#/u/${encodeURIComponent(p.nick)}?de=mensagens">${avatarHTML(p, "avatar av-xs")}<span class="chat-name"><b>@${esc(p.nick)}</b><span class="eyebrow">${esc(p.nome)}</span></span></a>
    </div></header>
    <section class="chat" id="chatLog" aria-live="polite">${log || `<p class="chat-empty">${connected ? "Vocês estão konectados. Mande o primeiro oi." : "Nenhuma mensagem."}</p>`}</section>
    ${connected
      ? `<form class="composer" id="chatForm"><textarea id="chatIn" class="input" rows="1" maxlength="1000" placeholder="Mensagem para @${esc(p.nick)}" aria-label="Mensagem para @${esc(p.nick)}"></textarea><button class="send" type="submit" aria-label="Enviar">${ic("send")}</button></form>`
      : `<div class="composer off">${ic("lock")}<span>Vocês não estão konectados. Konecte-se para conversar.</span></div>`}`;
  view.scrollTop = view.scrollHeight;
  let changed = false;
  DB.msgs.forEach(m => { if (m.de === p.id && m.para === u.id && !m.lida) { m.lida = true; changed = true; } });
  if (changed) { DB.save(); renderChrome({ tab: "perfil" }, u); }
  const form = $("#chatForm");
  if (!form) return;
  const inp = $("#chatIn");
  const grow = () => { inp.style.height = "auto"; inp.style.height = Math.min(120, Math.max(46, inp.scrollHeight)) + "px"; };
  inp.value = SS.get(key) || ""; grow();
  inp.addEventListener("input", () => { SS.set(key, inp.value); grow(); });
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (form.requestSubmit) form.requestSubmit(); else form.dispatchEvent(new Event("submit", { cancelable: true })); }
  });
  form.addEventListener("submit", e => {
    e.preventDefault();
    const texto = inp.value.trim(); if (!texto) return;
    if (!isConnected(u.id, p.id)) { toast("Vocês não estão mais konectados.", true); render(); return; }
    DB.msgs.push({ id: uid("m"), de: u.id, para: p.id, texto, t: new Date().toISOString(), lida: false });
    DB.save(); SS.del(key); render();
    const again = $("#chatIn"); if (again) again.focus();
  });
}, { tab: "perfil" });
function installAppIcon(onlyTouch = false) {
  const draw = size => {
    const c = document.createElement("canvas"); c.width = c.height = size;
    const x = c.getContext("2d"), s = size / 64;
    x.fillStyle = "#C4FF2E"; x.fillRect(0, 0, size, size);
    x.fillStyle = "#0D0F0B"; x.beginPath();
    [[19, 50], [26, 14], [34, 14], [30.6, 31.5], [45, 14], [55, 14], [37.5, 33], [47, 50], [37.5, 50], [31.3, 37.5], [28.8, 40], [27, 50]]
      .forEach(([px, py], i) => i ? x.lineTo(px * s, py * s) : x.moveTo(px * s, py * s));
    x.closePath(); x.fill();
    return c.toDataURL("image/png");
  };
  try {
    const i180 = draw(180), i512 = draw(512), start = location.href.split("#")[0];
    const touch = document.createElement("link"); touch.rel = "apple-touch-icon"; touch.href = i180; document.head.appendChild(touch);
    const manifest = {
      name: "Kohe", short_name: "Kohe", start_url: start, scope: start.replace(/[^/]*$/, ""),
      display: "standalone", orientation: "portrait", background_color: "#090A08", theme_color: "#090A08",
      icons: [{ src: i512, sizes: "512x512", type: "image/png", purpose: "any" }, { src: i180, sizes: "180x180", type: "image/png" }]
    };
    if (onlyTouch) return;
    const m = document.createElement("link"); m.rel = "manifest";
    m.href = "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(m);
  } catch (e) {}
}

/* ---------- instalar na tela inicial (iPhone e Android) ---------- */
// No site publicado (GitHub Pages), usa manifesto, ícones e service worker em arquivos de verdade:
// é o que o Chrome do Android exige para abrir o Kohe em tela cheia. No link do Claude e no
// arquivo local esses arquivos não existem, e o manifesto continua sendo gerado por código.
async function setupInstall() {
  const web = /^https?:$/.test(location.protocol) && window.self === window.top;
  const exists = async url => { try { return (await fetch(url, { method: "HEAD", cache: "no-store" })).ok; } catch (e) { return false; } };
  if (web && await exists("manifest.webmanifest")) {
    const lk = document.createElement("link"); lk.rel = "manifest"; lk.href = "manifest.webmanifest"; document.head.appendChild(lk);
    if (await exists("apple-touch-icon.png")) {
      const ap = document.createElement("link"); ap.rel = "apple-touch-icon"; ap.href = "apple-touch-icon.png"; document.head.appendChild(ap);
    } else installAppIcon(true);
    if ("serviceWorker" in navigator && await exists("sw.js")) navigator.serviceWorker.register("sw.js").catch(() => {});
    return;
  }
  installAppIcon();
}
let INSTALL_EVT = null;   // Chrome/Android: pedido de instalação guardado para o botão da dica
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); INSTALL_EVT = e;
  const b = document.getElementById("tipInstall"); if (b) b.hidden = false;
});
window.addEventListener("appinstalled", () => { INSTALL_EVT = null; Prefs.d.dicaTela = true; Prefs.save(); });

function maybeInstallTip() {
  let show = false;
  try {
    const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
    show = !Prefs.d.dicaTela && !standalone && window.self === window.top && matchMedia("(pointer: coarse)").matches;
  } catch (e) { show = false; }
  if (!show) return;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  setTimeout(() => {
    if ($(".scrim")) return;
    const sh = openSheet(`
      <div class="sheet-head"><h2 class="disp">Abra como app</h2><button class="icon-btn" type="button" data-close aria-label="Fechar">${ic("x")}</button></div>
      <p class="lead">Coloque o Kohe na tela inicial para abrir em tela cheia, sem a barra do navegador. Não precisa instalar nada da loja.</p>
      <ol class="steps">${ios
        ? `<li>Toque em <b>Compartilhar</b> ${ic("share")} na barra do Safari.</li><li>Escolha <b>Adicionar à Tela de Início</b>.</li>`
        : `<li>Toque no menu ${ic("dots")} do Chrome.</li><li>Escolha <b>Adicionar à tela inicial</b> (ou <b>Instalar app</b>) e confirme.</li>`}<li>Abra o Kohe pelo ícone verde.</li></ol>
      ${ios ? "" : `<button class="btn btn-volt btn-block" type="button" id="tipInstall"${INSTALL_EVT ? "" : " hidden"}>${ic("plus")} Adicionar à tela inicial</button>`}
      <button class="btn${ios ? " btn-volt" : ""} btn-block" type="button" data-close>Entendi</button>`);
    sh.el.addEventListener("click", ev => { if (ev.target.closest("[data-close]")) { Prefs.d.dicaTela = true; Prefs.save(); } });
    const tipBtn = $("#tipInstall", sh.el);
    if (tipBtn) tipBtn.addEventListener("click", async () => {
      if (!INSTALL_EVT) return;
      INSTALL_EVT.prompt();
      try { await INSTALL_EVT.userChoice; } catch (err) {}
      INSTALL_EVT = null; Prefs.d.dicaTela = true; Prefs.save(); sh.close();
    });
  }, 1200);
}

/* ---------- teclado no celular: o app acompanha a área visível (cabeçalho fixo no chat) ---------- */
let BASE_VH = 0;
function syncViewport() {
  const vv = window.visualViewport; if (!vv) return;
  const root = document.documentElement;
  const touch = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
  const layoutH = root.clientHeight || window.innerHeight;
  BASE_VH = Math.max(BASE_VH, vv.height);
  const kb = Math.max(0, layoutH - vv.height - vv.offsetTop);
  const open = touch && (kb > 80 || vv.height < BASE_VH - 150);
  root.style.setProperty("--vvh", Math.round(vv.height) + "px");
  root.style.setProperty("--vvtop", Math.round(vv.offsetTop) + "px");
  const was = root.classList.contains("kb-open");
  root.classList.toggle("kb-open", open);
  if (open && !was && location.hash.startsWith("#/chat/")) { const v = $("#view"); v.scrollTop = v.scrollHeight; }
}
if (window.visualViewport) {
  visualViewport.addEventListener("resize", syncViewport);
  visualViewport.addEventListener("scroll", syncViewport);
  window.addEventListener("orientationchange", () => { BASE_VH = 0; setTimeout(syncViewport, 400); });
}

(async function boot() {
  Prefs.load(); applyTheme();
  if (!DB.load()) await seedDB(); else await migrateDB();
  purgeExcluded();
  $("#fab").addEventListener("click", () => { SS.del("kohe.draft"); go("/nova"); });
  window.addEventListener("storage", ev => {
    if (ev.key === DB_KEY) { DB.load(); if (!$(".scrim")) render(); }
    else if (ev.key === "kohe.prefs") { Prefs.load(); applyTheme(); }
  });
  render();
  setupInstall();
  maybeInstallTip();
  koheDiag();   // provisório (KM 2): confirma a conexão no console, sem afetar a tela
})();
</script>
